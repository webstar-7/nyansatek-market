<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b8322a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NYANSATEK Rider</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--p:#b8322a;--a:#d1a03a;--bg:#f3f4f7;--b:#e2e6ec;--g:#667487;--ok:#127a46;--bad:#b42318;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui,sans-serif;}
body{background:var(--bg);color:#111827;min-height:100vh;padding-bottom:40px;}
header{background:var(--p);color:#fff;padding:14px 16px calc(14px);position:sticky;top:0;z-index:5;}
header .row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
header b{font-size:1.05rem;}
.stats{display:flex;gap:10px;margin-top:10px;}
.stat{flex:1;background:rgba(255,255,255,.1);border-radius:10px;padding:8px 10px;font-size:.78rem;}
.stat b{display:block;font-size:1.05rem;margin-top:2px;}
.toggle{border:0;border-radius:999px;padding:8px 14px;font-weight:800;cursor:pointer;}
.toggle.on{background:#22c55e;color:#052e16;} .toggle.off{background:#fff;color:var(--p);}
main{padding:12px 14px;max-width:640px;margin:0 auto;}
h2{font-size:.95rem;margin:16px 0 8px;color:#344054;}
.job{background:#fff;border:1px solid var(--b);border-radius:14px;padding:14px;margin:10px 0;}
.job .top{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--g);}
.job .fee{font-weight:800;color:var(--ok);font-size:1rem;}
.leg{display:flex;gap:10px;margin-top:10px;font-size:.92rem;}
.leg .dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none;}
.leg small{display:block;color:var(--g);font-size:.8rem;margin-top:2px;}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.btn{border:0;border-radius:10px;padding:11px 14px;font-size:.92rem;font-weight:700;cursor:pointer;background:var(--p);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.btn.gold{background:var(--a);color:#1a1405;} .btn.sec{background:#fff;color:var(--p);border:1px solid var(--b);}
.btn.wide{width:100%;justify-content:center;}
.btn:disabled{opacity:.5;}
.cash{background:#fff7e6;border:1px solid #f5d48c;border-radius:10px;padding:8px 10px;margin-top:10px;font-size:.88rem;}
.empty{color:var(--g);text-align:center;padding:24px 0;font-size:.9rem;}
.card{background:#fff;border:1px solid var(--b);border-radius:14px;padding:18px;max-width:420px;margin:40px auto;}
.fg{margin:12px 0;} .fg label{display:block;font-size:.8rem;font-weight:600;margin-bottom:4px;color:#344054;}
.fg input,.fg select,.fg textarea{width:100%;padding:11px 12px;border:1px solid var(--b);border-radius:10px;font-size:1rem;background:#fff;}
.card.wide{max-width:560px;margin:16px auto;}
.card h3{font-size:.95rem;margin:20px 0 2px;color:var(--p);border-top:1px solid var(--b);padding-top:14px;}
.card h3:first-of-type{border-top:0;padding-top:0;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;}
@media(max-width:420px){.two{grid-template-columns:1fr;}}
.hint{font-size:.8rem;color:var(--g);margin:4px 0;line-height:1.4;}
.notice{background:#fff7e6;border:1px solid #f5d48c;border-radius:10px;padding:10px 12px;font-size:.88rem;margin:10px 0;line-height:1.45;}
.notice.bad{background:#fdecea;border-color:#f1c0bb;} .notice.ok{background:#e7f6ee;border-color:#b7e4c7;}
.steps{list-style:none;margin:12px 0;} .steps li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:.92rem;border-bottom:1px solid var(--b);}
.steps li:last-child{border-bottom:0;} .steps .mk{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:.75rem;font-weight:800;background:#eef0f4;color:#667487;}
.steps .done .mk{background:#127a46;color:#fff;} .steps small{display:block;color:var(--g);font-size:.8rem;}
.selfie{display:flex;gap:12px;align-items:center;margin:8px 0;} .selfie img{width:84px;height:84px;border-radius:12px;object-fit:cover;border:1px solid var(--b);background:#eef0f4;}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;line-height:1.45;margin:12px 0;} .chk input{width:20px;height:20px;flex:none;margin-top:2px;}
.err{color:var(--bad);font-size:.88rem;font-weight:600;margin:8px 0;}
.pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:.75rem;font-weight:700;background:#eef0f4;color:#344054;}
</style>
</head>
<body>
<div id="app"><div class="empty">Loading…</div></div>
<script>
const sb = window.supabase.createClient("https://kqwqbohoeltlbwcopeug.supabase.co", "sb_publishable_T6oCd3aRO0OPheQXEkmvRA_nvIhEPcv");
const E = s => s == null ? '' : String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const GH = n => 'GH₵' + Number(n || 0).toFixed(2);
const local = p => p ? '0' + String(p).slice(3) : '';
const app = document.getElementById('app');
const normPhone = p => { const d = String(p || '').replace(/\D/g, ''); return /^233\d{9}$/.test(d) ? d : /^0\d{9}$/.test(d) ? '233' + d.slice(1) : /^\d{9}$/.test(d) ? '233' + d : null; };
const KIND = { to_customer: 'Deliver to customer', to_pickup_point: 'Take to pickup point', return_to_shop: 'Return to shop' };
let ME = null, timer = null;

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return loginView();
  const { data, error } = await sb.rpc('rider_me');
  if (error || !data) { await sb.auth.signOut(); return loginView('This login is not a NYANSATEK rider account.'); }
  ME = data;
  if (ME.screening_status !== 'approved') return statusView();
  if (!ME.active) return app.innerHTML = '<div class="card">Your rider account is switched off. Contact NYANSATEK.</div>';
  load();
}

function loginView(msg) {
  clearInterval(timer);
  app.innerHTML = `<div class="card"><h2 style="margin-top:0;font-size:1.2rem;">NYANSATEK Rider</h2>
    <div class="fg"><label>Phone number</label><input id="ph" type="tel" autocomplete="username" placeholder="024XXXXXXX"></div>
    <div class="fg"><label>Password</label><input id="pw" type="password" autocomplete="current-password"></div>
    <div class="err" id="err">${E(msg || '')}</div><button class="btn gold wide" id="go">Sign in</button>
    <p style="font-size:.85rem;color:var(--g);margin:16px 0 8px;text-align:center;">New here?</p>
    <button class="btn sec wide" id="apply">Apply to ride with NYANSATEK</button></div>`;
  document.getElementById('apply').onclick = () => applyView();
  document.getElementById('go').onclick = async () => {
    const phone = normPhone(document.getElementById('ph').value), err = document.getElementById('err');
    if (!phone) { err.textContent = 'Enter your phone number.'; return; }
    const { error } = await sb.auth.signInWithPassword({ email: phone + '@rider.nyansatek.internal', password: document.getElementById('pw').value });
    if (error) { err.textContent = 'Phone number or password is wrong.'; return; }
    start();
  };
}

// ---------- applying, and where the application stands ----------
const FN = "https://kqwqbohoeltlbwcopeug.supabase.co/functions/v1/rider-apply", KEY = "sb_publishable_T6oCd3aRO0OPheQXEkmvRA_nvIhEPcv";
const $ = id => document.getElementById(id);
const dmy = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const msgOf = e => String(e?.message || e || 'Something went wrong. Try again.');
let SELFIE = null;
async function callFn(body, token) {
  try {
    const res = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + (token || KEY) }, body: JSON.stringify(body) });
    return await res.json();
  } catch { return { error: 'Could not reach the server. Check your internet and try again.' }; }
}
// shrink the camera photo to a small JPEG before it leaves the phone
function shrink(file) {
  return new Promise((ok, no) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 640 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      ok(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(u); no(new Error('That photo could not be read. Try again.')); };
    img.src = u;
  });
}
function selfieHtml(have) {
  return `<div class="selfie"><img id="sf-img" alt="" ${have ? `src="${have}"` : ''}>
    <div><label class="btn sec" style="cursor:pointer;">${have ? 'Retake selfie' : 'Take a selfie'}<input id="sf" type="file" accept="image/*" capture="user" style="display:none"></label>
    <div class="hint">Your face only, in good light, no cap or sunglasses. Do not photograph your Ghana Card: we never keep a picture of it.</div></div></div>`;
}
function wireSelfie() {
  $('sf').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { SELFIE = await shrink(f); $('sf-img').src = SELFIE; } catch (x) { alert(msgOf(x)); }
  };
}
const fld = (id, label, a, o = {}) => `<div class="fg"><label for="f-${id}">${label}</label><input id="f-${id}" type="${o.type || 'text'}" value="${E(o.fmt ? o.fmt(a[id]) : a[id])}" ${o.ph ? `placeholder="${o.ph}"` : ''} ${o.attrs || ''}></div>`;
function formHtml(a) {
  const tel = { type: 'tel', fmt: local, ph: '024XXXXXXX' };
  return `<h3>About you</h3>
    ${fld('full_name', 'Full name, exactly as on your Ghana Card', a, { attrs: 'autocomplete="name"' })}
    <div class="two">${fld('date_of_birth', 'Date of birth', a, { type: 'date' })}${fld('ghana_card_number', 'Ghana Card number', a, { ph: 'GHA-123456789-0', attrs: 'autocapitalize="characters"' })}</div>
    ${fld('residential_address', 'Where you live (house number, street, area, town)', a)}
    ${fld('digital_address', 'GhanaPost digital address (if you know it)', a, { ph: 'GA-123-4567', attrs: 'autocapitalize="characters"' })}
    <h3>Your vehicle and licence</h3>
    <div class="two"><div class="fg"><label for="f-vehicle">Vehicle</label><select id="f-vehicle">${['motorbike', 'car', 'van', 'truck'].map(v => `<option ${a.vehicle === v ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
    ${fld('plate_number', 'Number plate', a, { attrs: 'autocapitalize="characters"' })}</div>
    <div class="two">${fld('licence_number', "Driver's licence number", a, { attrs: 'autocapitalize="characters"' })}${fld('licence_class', 'Licence class (A, B…)', a)}</div>
    <div class="two">${fld('licence_expiry', 'Licence expires on', a, { type: 'date' })}${fld('roadworthy_expiry', 'Roadworthy expires on', a, { type: 'date' })}</div>
    ${fld('insurance_expiry', 'Insurance expires on', a, { type: 'date' })}
    <h3>How we pay you</h3>
    <div class="two">${fld('momo_number', 'MoMo number', a, tel)}${fld('momo_name', 'Name on that MoMo account', a)}</div>
    <p class="hint">The MoMo account must be in your own name.</p>
    <h3>Your guarantor</h3>
    <p class="hint">An adult who knows you well and will answer for you. We will call them.</p>
    ${fld('guarantor_name', "Guarantor's full name", a)}
    <div class="two">${fld('guarantor_phone', "Guarantor's phone", a, tel)}${fld('guarantor_relationship', 'How they know you', a, { ph: 'Uncle, employer, pastor…' })}</div>
    <h3>Emergency contact</h3>
    <div class="two">${fld('emergency_name', 'Name', a)}${fld('emergency_phone', 'Phone', a, tel)}</div>`;
}
const FIELDS = ['full_name', 'date_of_birth', 'ghana_card_number', 'residential_address', 'digital_address', 'vehicle', 'plate_number', 'licence_number', 'licence_class',
  'licence_expiry', 'roadworthy_expiry', 'insurance_expiry', 'momo_number', 'momo_name', 'guarantor_name', 'guarantor_phone', 'guarantor_relationship', 'emergency_name', 'emergency_phone'];
const readForm = () => Object.fromEntries(FIELDS.map(k => [k, $('f-' + k).value.trim()]));

function applyView() {
  clearInterval(timer); SELFIE = null;
  app.innerHTML = `<div class="card"><h2 style="margin-top:0;font-size:1.2rem;">Apply to ride</h2>
    <p class="hint">Before you can take jobs we confirm who you are, check your licence and vehicle papers, and call your guarantor. Have these ready:</p>
    <ul class="hint" style="margin:6px 0 6px 18px;"><li>Your Ghana Card (the number, not a photo)</li><li>Your driver's licence, roadworthy and insurance</li><li>A guarantor's name and phone number</li><li>A MoMo number in your own name</li></ul>
    <div class="fg"><label>Your phone number</label><input id="ph" type="tel" autocomplete="tel" placeholder="024XXXXXXX"></div>
    <div class="err" id="err"></div><button class="btn gold wide" id="go">Send me a code</button>
    <p style="text-align:center;margin-top:12px;"><a href="#" id="back" style="color:var(--p);font-size:.88rem;">I already have a login</a></p></div>`;
  $('back').onclick = e => { e.preventDefault(); loginView(); };
  $('go').onclick = async () => {
    const phone = normPhone($('ph').value), err = $('err');
    if (!phone) { err.textContent = 'Enter your phone number.'; return; }
    $('go').disabled = true; err.textContent = '';
    const { error } = await sb.rpc('rider_request_phone_code', { p_phone: phone });
    if (error) { $('go').disabled = false; err.textContent = msgOf(error); return; }
    applyForm(phone, {});
  };
}
function applyForm(phone, a) {
  app.innerHTML = `<div class="card wide"><h2 style="margin-top:0;font-size:1.2rem;">Your application</h2>
    <div class="notice ok">We sent a 6-digit code by SMS to <b>${E(local(phone))}</b>. It works for 10 minutes.</div>
    <div class="two"><div class="fg"><label for="code">Code from the SMS</label><input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>
    <div class="fg"><label for="pw">Choose a password (8 or more)</label><input id="pw" type="password" autocomplete="new-password"></div></div>
    ${formHtml(a)}
    <h3>Your selfie</h3>${selfieHtml(SELFIE)}
    <label class="chk"><input type="checkbox" id="consent"><span>I agree that NYANSATEK may confirm my identity with the National Identification Authority using my Ghana Card number and my biometrics, check my licence and vehicle papers, and call my guarantor. What I have entered is true.</span></label>
    <div class="err" id="err"></div><button class="btn gold wide" id="go">Send my application</button>
    <p style="text-align:center;margin-top:12px;"><a href="#" id="back" style="color:var(--p);font-size:.88rem;">Cancel</a></p></div>`;
  wireSelfie();
  $('back').onclick = e => { e.preventDefault(); loginView(); };
  $('go').onclick = async () => {
    const err = $('err'), pw = $('pw').value, f = readForm();
    if (!/^\d{6}$/.test($('code').value.trim())) { err.textContent = 'Enter the 6-digit code from the SMS.'; return; }
    if (pw.length < 8) { err.textContent = 'Choose a password of at least 8 characters.'; return; }
    if (!SELFIE) { err.textContent = 'Take a selfie.'; return; }
    if (!$('consent').checked) { err.textContent = 'Tick the box to agree to the checks.'; return; }
    $('go').disabled = true; err.textContent = 'Sending…';
    const out = await callFn({ action: 'apply', phone, code: $('code').value.trim(), password: pw, selfie: SELFIE, application: { ...f, consent: true } });
    if (out.error) { $('go').disabled = false; err.textContent = out.error; return; }
    const { error } = await sb.auth.signInWithPassword({ email: phone + '@rider.nyansatek.internal', password: pw });
    if (error) return loginView('Application sent. Sign in to see how it is going.');
    start();
  };
}

function statusView() {
  clearInterval(timer);
  const st = ME.screening_status, s = ME.steps || {}, open = st === 'applied' || st === 'more_info';
  const head = { applied: 'Your application is being checked', more_info: 'We need something from you', rejected: 'Your application was not approved', suspended: 'Your account is suspended' }[st] || 'Your account';
  const step = (done, t, sub) => `<li class="${done ? 'done' : ''}"><span class="mk">${done ? '✓' : ''}</span><div>${t}<small>${sub}</small></div></li>`;
  app.innerHTML = `<div class="card wide"><h2 style="margin-top:0;font-size:1.2rem;">${head}</h2>
    <p class="hint">${E(ME.name)} · ${E(local(ME.phone))}</p>
    ${ME.decision_note && st !== 'applied' ? `<div class="notice ${st === 'more_info' ? '' : 'bad'}"><b>${st === 'more_info' ? 'What to do' : 'Reason'}:</b> ${E(ME.decision_note)}</div>` : ''}
    ${open ? `<ul class="steps">
      ${step(s.details, 'Your details', 'Sent' + (ME.applied_at ? ' on ' + new Date(ME.applied_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : ''))}
      ${step(s.identity, 'Identity check', 'The team will ask you to come with your Ghana Card for a fingerprint or face check with the NIA.')}
      ${step(s.validation, 'Licence, vehicle papers and guarantor', 'Bring your licence, roadworthy and insurance. We call your guarantor.')}
      ${step(false, 'Approval', 'You get an SMS, then you can go online and take jobs.')}</ul>
      <button class="btn sec wide" id="edit">${st === 'more_info' ? 'Fix my details' : 'Change my details'}</button>` : ''}
    ${st === 'rejected' || st === 'suspended' ? '<p class="hint">If you think this is a mistake, call the NYANSATEK team.</p>' : ''}
    <p style="text-align:center;margin-top:14px;"><button class="btn sec" id="out">Sign out</button> <button class="btn sec" id="again">Check again</button></p></div>`;
  $('out').onclick = () => sb.auth.signOut().then(() => loginView());
  $('again').onclick = start;
  if (open) $('edit').onclick = editView;
}
function editView() {
  SELFIE = null;
  app.innerHTML = `<div class="card wide"><h2 style="margin-top:0;font-size:1.2rem;">Your details</h2>
    <p class="hint">If you change your name, date of birth, Ghana Card number, licence, vehicle, guarantor or MoMo, the team checks that part again.</p>
    ${formHtml(ME.application || {})}
    <h3>Your selfie</h3><p class="hint">Only retake it if the team asked you to.</p>${selfieHtml(null)}
    <div class="err" id="err"></div><button class="btn gold wide" id="go">Save</button>
    <p style="text-align:center;margin-top:12px;"><a href="#" id="back" style="color:var(--p);font-size:.88rem;">Cancel</a></p></div>`;
  wireSelfie();
  $('back').onclick = e => { e.preventDefault(); statusView(); };
  $('go').onclick = async () => {
    const err = $('err'); $('go').disabled = true; err.textContent = 'Saving…';
    const { error } = await sb.rpc('rider_update_application', { p: readForm() });
    if (error) { $('go').disabled = false; err.textContent = msgOf(error); return; }
    if (SELFIE) {
      const { data: { session } } = await sb.auth.getSession();
      const out = await callFn({ action: 'selfie', selfie: SELFIE }, session?.access_token);
      if (out.error) { $('go').disabled = false; err.textContent = 'Details saved, but the selfie was not: ' + out.error; return; }
    }
    start();
  };
}
// an approved rider renews a document date
function expiryView() {
  clearInterval(timer);
  const a = ME.application || {};
  app.innerHTML = `<div class="card"><h2 style="margin-top:0;font-size:1.2rem;">Document dates</h2>
    <p class="hint">When you renew a document, enter its new expiry date here and show the document to the team. An expired document pauses your account.</p>
    ${fld('licence_expiry', "Driver's licence expires on", a, { type: 'date' })}${fld('roadworthy_expiry', 'Roadworthy expires on', a, { type: 'date' })}${fld('insurance_expiry', 'Insurance expires on', a, { type: 'date' })}
    <div class="err" id="err"></div><button class="btn gold wide" id="go">Save</button>
    <p style="text-align:center;margin-top:12px;"><a href="#" id="back" style="color:var(--p);font-size:.88rem;">Back</a></p></div>`;
  $('back').onclick = e => { e.preventDefault(); load(); };
  $('go').onclick = async () => {
    const v = k => $('f-' + k).value || null;
    const { error } = await sb.rpc('rider_update_expiry', { p_licence: v('licence_expiry'), p_roadworthy: v('roadworthy_expiry'), p_insurance: v('insurance_expiry') });
    if (error) { $('err').textContent = msgOf(error); return; }
    start();
  };
}

function mapLink(place) {
  const q = [place?.address, place?.landmark, place?.zone].filter(Boolean).join(', ');
  return q ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q + ', Ghana')}` : null;
}
function placeHtml(color, label, pl, full) {
  if (!pl) return '';
  const m = full ? mapLink(pl) : null;
  return `<div class="leg"><span class="dot" style="background:${color}"></span><div><b>${E(label)}</b> ${E(pl.name || pl.zone || '')}
    <small>${E([pl.address, pl.landmark].filter(Boolean).join(' · ') || (pl.zone ? 'Area: ' + pl.zone : ''))}</small>
    ${full ? `<div class="acts" style="margin-top:6px;">${pl.phone ? `<a class="btn sec" href="tel:+${E(pl.phone)}">Call ${E(local(pl.phone))}</a>` : ''}${m ? `<a class="btn sec" target="_blank" rel="noopener" href="${m}">Map</a>` : ''}</div>` : ''}</div></div>`;
}
function jobHtml(j, mode) {
  const full = mode !== 'open';
  let acts = '';
  if (mode === 'open') acts = `<button class="btn gold wide" onclick="accept('${j.job_id}')">Accept job · ${GH(j.fee)}</button>`;
  else if (mode === 'mine') {
    if (j.status === 'assigned') acts = `<button class="btn wide" onclick="act('${j.job_id}','at_shop')">I'm at the ${j.kind === 'return_to_shop' ? 'pickup point' : 'shop'}</button>`;
    else if (j.status === 'at_shop') acts = `<button class="btn gold wide" onclick="act('${j.job_id}','picked_up')" ${j.kind !== 'return_to_shop' && j.order_status !== 'ready' ? 'disabled' : ''}>${j.kind !== 'return_to_shop' && j.order_status !== 'ready' ? 'Waiting for the shop to pack it…' : 'I have the order'}</button>`;
    else if (j.status === 'picked_up') acts = j.kind === 'to_customer' ? `<button class="btn gold wide" onclick="deliver('${j.job_id}')">Delivered: enter customer's code</button>`
      : j.kind === 'to_pickup_point' ? `<button class="btn gold wide" onclick="act('${j.job_id}','dropped')">Dropped at the pickup point</button>`
      : `<button class="btn gold wide" onclick="act('${j.job_id}','returned')">Handed back to the shop</button>`;
  }
  return `<div class="job"><div class="top"><span><b style="color:#111827">${E(j.code)}</b> · ${E(KIND[j.kind])} · ${E(j.vehicle)}</span><span class="fee">${GH(j.fee)}</span></div>
    ${placeHtml('#d1a03a', 'From', j.from, full)}${placeHtml('#127a46', 'To', j.to, full)}
    <div style="font-size:.85rem;color:var(--g);margin-top:8px;">${j.items} item${j.items === 1 ? '' : 's'}${mode === 'done' ? ' · done' : j.order_status === 'cancelled' ? ' · <b style="color:var(--bad)">order cancelled</b>' : ''}</div>
    ${j.collect_cash > 0 && mode !== 'done' ? `<div class="cash">Collect <b>${GH(j.collect_cash)}</b> cash from the customer. Keep your ${GH(j.fee)} fee and give <b>${GH(j.collect_cash - j.fee)}</b> to the shop.</div>` : ''}
    ${j.payment_method === 'momo' && j.kind === 'to_customer' && mode !== 'done' ? '<div class="cash" style="background:#e7f6ee;border-color:#b7e4c7;">Already paid by MoMo. Collect nothing.</div>' : ''}
    ${acts ? `<div class="acts">${acts}</div>` : ''}</div>`;
}

async function load() {
  clearInterval(timer); timer = setInterval(refresh, 15000);
  await refresh();
}
async function refresh() {
  const [{ data: me }, { data: jobs, error }] = await Promise.all([sb.rpc('rider_me'), sb.rpc('rider_jobs')]);
  if (error) { if (/JWT|session/i.test(error.message)) return loginView(); }
  if (me) ME = me;
  if (ME.screening_status !== 'approved') return statusView();
  const J = jobs || { mine: [], open: [], done_today: [] };
  app.innerHTML = `<header><div class="row"><div><b>${E(ME.name)}</b><div style="font-size:.8rem;opacity:.8">${E(ME.vehicle)}${ME.plate ? ' · ' + E(ME.plate) : ''}</div></div>
      <button class="toggle ${ME.online ? 'on' : 'off'}" onclick="setOnline(${!ME.online})">${ME.online ? 'Online' : 'Go online'}</button></div>
    <div class="stats"><div class="stat">Cash for shops<b>${GH(ME.cash_on_hand)}</b></div><div class="stat">Fees today<b>${GH(ME.fees_today)}</b></div></div></header>
  <main>
    ${ME.expiring && ME.expiring.length ? `<div class="notice"><b>Expiring soon or expired:</b> ${E(ME.expiring.join(', '))}. Renew it and <a href="#" onclick="expiryView();return false;" style="color:var(--p);font-weight:700;">update the date</a>, or your account will be paused.</div>` : ''}
    <h2>My jobs (${J.mine.length})</h2>${J.mine.length ? J.mine.map(j => jobHtml(j, 'mine')).join('') : '<div class="empty">No jobs yet.</div>'}
    <h2>Available jobs${ME.online ? ` (${J.open.length})` : ''}</h2>${!ME.online ? '<div class="empty">Go online to see jobs near you.</div>' : J.open.length ? J.open.map(j => jobHtml(j, 'open')).join('') : '<div class="empty">No jobs right now. This page refreshes itself.</div>'}
    ${J.done_today.length ? `<h2>Done today (${J.done_today.length})</h2>${J.done_today.map(j => jobHtml(j, 'done')).join('')}` : ''}
    <p style="text-align:center;margin-top:24px;"><button class="btn sec" onclick="expiryView()">Document dates</button> <button class="btn sec" onclick="sb.auth.signOut().then(()=>loginView())">Sign out</button></p>
  </main>`;
}
async function setOnline(v) { const { error } = await sb.rpc('rider_set_online', { p_online: v }); if (error) alert(error.message); refresh(); }
async function accept(id) { const { error } = await sb.rpc('rider_accept_job', { p_job: id }); if (error) alert(error.message); refresh(); }
async function act(id, a) { const { error } = await sb.rpc('rider_job_action', { p_job: id, p_action: a }); if (error) alert(error.message); refresh(); }
async function deliver(id) {
  const code = prompt("Enter the customer's 4-digit code:");
  if (code === null) return;
  const { error } = await sb.rpc('rider_job_action', { p_job: id, p_action: 'delivered', p_code: code.trim() });
  if (error) alert(error.message); refresh();
}
start();
</script>
</body>
</html>
