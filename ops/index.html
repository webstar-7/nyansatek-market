<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>NYANSATEK team · nyansatek.store</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--p:#17264a;--a:#d1a03a;--bg:#f3f4f7;--b:#e2e6ec;--g:#667487;--ok:#127a46;--bad:#b42318;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui,sans-serif;}
body{background:var(--bg);color:#111827;}
header{background:var(--p);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
header b span{color:var(--a);}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:10px 16px;background:#fff;border-bottom:1px solid var(--b);position:sticky;top:0;z-index:5;}
nav button{border:1px solid var(--b);background:#fff;border-radius:999px;padding:7px 12px;font-size:.85rem;cursor:pointer;}
nav button.on{background:var(--p);color:#fff;border-color:var(--p);}
main{padding:16px;max-width:1200px;margin:0 auto;}
h2{font-size:1.05rem;margin:4px 0 12px;}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--b);border-radius:12px;overflow:hidden;font-size:.86rem;}
th,td{padding:8px 10px;border-bottom:1px solid var(--b);text-align:left;vertical-align:top;}
th{background:#f8f9fb;font-size:.78rem;color:#344054;}
tr.late td{background:#fff7e6;}
.btn{border:0;border-radius:8px;padding:7px 11px;font-size:.84rem;font-weight:700;cursor:pointer;background:var(--p);color:#fff;}
.btn.sec{background:#fff;color:var(--p);border:1px solid var(--b);} .btn.gold{background:var(--a);color:#1a1405;} .btn.bad{background:#fff;color:var(--bad);border:1px solid #f1c0bb;}
.box{background:#fff;border:1px solid var(--b);border-radius:12px;padding:14px;margin:12px 0;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;}
.fg{display:flex;flex-direction:column;gap:3px;font-size:.78rem;font-weight:600;color:#344054;}
input,select{padding:8px 10px;border:1px solid var(--b);border-radius:8px;font-size:.9rem;background:#fff;}
.pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:.74rem;font-weight:700;background:#eef0f4;}
.pill.ok{background:#e7f6ee;color:var(--ok);} .pill.warn{background:#fff3d6;color:#8a5a00;} .pill.bad{background:#fdecea;color:var(--bad);}
.note{font-size:.8rem;color:var(--g);}
.empty{color:var(--g);text-align:center;padding:24px;}
.card{background:#fff;border:1px solid var(--b);border-radius:14px;padding:20px;max-width:400px;margin:60px auto;}
.err{color:var(--bad);font-weight:600;font-size:.88rem;margin:8px 0;}
.secret{font-family:monospace;background:#f3f4f7;padding:2px 6px;border-radius:6px;}
</style>
</head>
<body>
<div id="app"><div class="empty">Loading…</div></div>
<script>
const SUPABASE_URL = "https://kqwqbohoeltlbwcopeug.supabase.co";
const sb = window.supabase.createClient(SUPABASE_URL, "sb_publishable_T6oCd3aRO0OPheQXEkmvRA_nvIhEPcv");
const E = s => s == null ? '' : String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const GH = n => 'GH₵' + Number(n || 0).toFixed(2);
const local = p => p ? '0' + String(p).slice(3) : '';
const ago = t => { const m = Math.round((Date.now() - new Date(t)) / 60000); return m < 60 ? m + ' min' : Math.round(m / 60) + ' h'; };
const VEH = ['motorbike', 'car', 'van', 'truck'], RANK = { motorbike: 1, car: 2, van: 3, truck: 4 };
const app = document.getElementById('app');
const TABS = [['orders', 'Orders'], ['phone', 'Phone orders'], ['couriers', 'Couriers'], ['payouts', 'Payouts'], ['refunds', 'Refunds'], ['menus', 'Menus'], ['shops', 'Shops & restaurants'], ['desk', 'Pickup desk'], ['riders', 'Rider app'], ['zones', 'Zones'], ['points', 'Pickup points'], ['cats', 'Categories'], ['billing', 'Settings'], ['team', 'Team']];
let TAB = location.hash.slice(1) || 'orders', timer = null, IS_MASTER = false;
const fail = e => alert(e?.message || String(e));

async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return login();
  const { data: ok } = await sb.rpc('is_market_ops');
  if (ok !== true) { await sb.auth.signOut(); return login('This login is not a NYANSATEK team account, or it has been switched off.'); }
  const { data: me } = await sb.from('profiles').select('role,must_change_password,full_name').eq('id', session.user.id).maybeSingle();
  IS_MASTER = me?.role === 'master';
  if (me?.role === 'market_ops' && me.must_change_password) return choosePassword(session.user.email);
  if (!IS_MASTER && (TAB === 'team' || TAB === 'billing')) TAB = 'orders';
  shell(session.user.email, me?.full_name);
}
function choosePassword(email) {
  app.innerHTML = `<div class="card"><h2>Choose your password</h2>
    <p class="note" style="margin-bottom:12px;">Welcome${email ? ', ' + E(email) : ''}. Pick a private password only you know. You'll use it with your email to sign in from now on.</p>
    <div class="fg">New password (at least 8 characters)<input id="np1" type="password" autocomplete="new-password"></div><br>
    <div class="fg">Type it again<input id="np2" type="password" autocomplete="new-password"></div>
    <div class="err" id="err"></div><button class="btn gold" id="go" style="width:100%;padding:11px;">Save password</button></div>`;
  document.getElementById('go').onclick = async () => {
    const a = document.getElementById('np1').value, b = document.getElementById('np2').value, err = document.getElementById('err');
    if (a.length < 8) return err.textContent = 'Use at least 8 characters.';
    if (a !== b) return err.textContent = 'The two passwords are different.';
    const go = document.getElementById('go'); go.disabled = true; go.textContent = 'Saving…';
    const { error } = await sb.auth.updateUser({ password: a });
    if (error) { go.disabled = false; go.textContent = 'Save password'; return err.textContent = /weak|pwned|leak|common/i.test(error.message) ? 'That password is too common. Choose a different one.' : /different|same/i.test(error.message) ? 'Choose a password different from the one you were given.' : error.message; }
    await sb.rpc('ops_password_changed');
    start();
  };
}
function login(msg) {
  app.innerHTML = `<div class="card"><h2>NYANSATEK team</h2>
    <div class="fg">Email or business name<input id="em" type="text" autocomplete="username" placeholder="e.g. NYANSATEK"></div><br>
    <div class="fg">Password<input id="pw" type="password" autocomplete="current-password"></div>
    <div class="err" id="err">${E(msg || '')}</div><button class="btn gold" id="go" style="width:100%;padding:11px;">Sign in</button></div>`;
  document.getElementById('go').onclick = async () => {
    let email = document.getElementById('em').value.trim();
    if (!email.includes('@')) { const { data } = await sb.rpc('resolve_login_email', { p_login: email }); email = data || ''; }
    const { error } = email ? await sb.auth.signInWithPassword({ email, password: document.getElementById('pw').value }) : { error: true };
    if (error) return document.getElementById('err').textContent = 'Email / business name or password is wrong.';
    start();
  };
}
function shell(email, name) {
  app.innerHTML = `<header><b>nyansatek<span>.store</span> · team</b><span class="note" style="color:#cbd5e1">${E(name ? name + ' (' + email + ')' : email)} · <a href="#" style="color:#fff" onclick="sb.auth.signOut().then(()=>login());return false;">Sign out</a></span></header>
    <nav>${TABS.filter(([k]) => (k !== 'team' && k !== 'billing') || IS_MASTER).map(([k, l]) => `<button data-k="${k}" class="${TAB === k ? 'on' : ''}">${l}</button>`).join('')}</nav><main id="main"></main>`;
  app.querySelectorAll('nav button').forEach(b => b.onclick = () => { TAB = b.dataset.k; location.hash = TAB; app.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b)); show(); });
  show(); watchOrders();
}

// ---------- alerts: sound, browser notification and tab title for new orders and new MoMo IDs, on any tab ----------
let SEEN = null, BASE_TITLE = document.title;
function beep() {
  try { const a = new (window.AudioContext || window.webkitAudioContext)(); [0, .25, .5].forEach(t => { const o = a.createOscillator(), g = a.createGain();
    o.frequency.value = 880; g.gain.value = .2; o.connect(g); g.connect(a.destination); o.start(a.currentTime + t); o.stop(a.currentTime + t + .15); }); } catch (e) {}
}
async function watchOrders() {
  const check = async () => {
    const { data } = await sb.from('online_orders').select('id,code,momo_txn_id,payment_confirmed_at').eq('status', 'placed');
    const keys = new Set((data || []).map(o => o.id + ':' + (o.momo_txn_id || '')));
    const waiting = (data || []).length;
    document.title = waiting ? `(${waiting}) ${BASE_TITLE}` : BASE_TITLE;
    if (SEEN) {
      const fresh = (data || []).filter(o => !SEEN.has(o.id + ':' + (o.momo_txn_id || '')));
      if (fresh.length) {
        beep();
        const msg = fresh.map(o => o.code + (o.momo_txn_id ? ' · MoMo ID sent' : ' · new order')).join(', ');
        try { if (window.Notification && Notification.permission === 'granted') new Notification('NYANSATEK orders', { body: msg }); } catch (e) {}
        if (TAB === 'orders') orders();
      }
    }
    SEEN = keys;
  };
  check(); setInterval(check, 15000);
  let seenReq = null;
  const checkReq = async () => {
    const { data } = await sb.from('order_requests').select('id,kind').eq('status', 'new');
    const ids = new Set((data || []).map(r => r.id)), n = ids.size;
    const btn = document.querySelector('nav button[data-k="phone"]'); if (btn) btn.textContent = n ? `Phone orders (${n})` : 'Phone orders';
    if (seenReq && [...ids].some(id => !seenReq.has(id))) {
      beep();
      try { if (window.Notification && Notification.permission === 'granted') new Notification('NYANSATEK phone orders', { body: 'New voice note or call-back request' }); } catch (e) {}
      if (TAB === 'phone' && !PO.formOpen) phone();
    }
    seenReq = ids;
  };
  checkReq(); setInterval(checkReq, 15000);
}
function show() {
  clearInterval(timer);
  const fn = { orders, phone, couriers, payouts, refunds, menus, desk, cash, shops, riders, zones, points, cats, billing: IS_MASTER ? billing : orders, team: IS_MASTER ? team : orders }[TAB] || orders;
  fn(); if (TAB === 'orders') timer = setInterval(() => { if (!document.querySelector('#main select:focus')) fn(); }, 20000);
}
const M = () => document.getElementById('main');

// ---------- orders board ----------
// Every order is paid by MoMo to NYANSATEK. The team: 1) checks the MoMo and marks it paid, 2) calls the shop or
// restaurant and marks it confirmed, 3) picks a courier and calls them, 4) marks it on the way, then delivered.
// No SMS goes to a shop or courier on its own: the SMS buttons send one when it is worth the credit.
let COURIERS = [];
const tel = p => p ? `<a href="tel:${local(p)}">${local(p)}</a>` : '';
async function orders() {
  const since = new Date(Date.now() - 864e5).toISOString();
  const [{ data, error }, { data: cs }] = await Promise.all([
    sb.from('online_orders').select('*,organizations(business_name,vertical,shop_online_settings(shop_phone,whatsapp_number,shop_address)),pickup_points(name),delivery_zones(name),couriers(name,phone,company),online_order_items(qty,name_snapshot),online_checkouts(code,total)')
      .or(`status.in.(placed,accepted,ready,in_transit,at_pickup_point,returning),created_at.gte.${since}`).order('created_at', { ascending: false }).limit(300),
    sb.from('couriers').select('id,name,company,phone').eq('active', true).order('company').order('name')]);
  if (error) return M().innerHTML = `<div class="err">${E(error.message)}</div>`;
  COURIERS = cs || [];
  const rows = data || [];
  const live = rows.filter(o => !['delivered', 'collected', 'completed', 'cancelled', 'returned'].includes(o.status));
  const finished = rows.filter(o => !live.includes(o));
  const paid = o => !!o.payment_confirmed_at;
  const minsLeft = o => Math.max(0, Math.ceil((new Date(o.accept_deadline) - Date.now()) / 60000));
  const late = o => o.status === 'placed' && (paid(o) ? Date.now() - new Date(o.payment_confirmed_at) > 10 * 60000 : minsLeft(o) < 5);
  const shopOf = o => { const s = o.organizations?.shop_online_settings; return (Array.isArray(s) ? s[0] : s) || {}; };
  const step = o => o.status === 'placed' ? (paid(o) ? ['warn', 'paid · call the shop'] : ['warn', 'waiting for payment'])
    : ({ accepted: ['', 'confirmed · send a courier'], ready: ['', 'ready · send a courier'], in_transit: ['', 'on the way'], at_pickup_point: ['', 'at pickup point'],
         delivered: ['ok', 'delivered'], collected: ['ok', 'collected'], completed: ['ok', 'completed'], cancelled: ['bad', 'cancelled'], returning: ['bad', 'returning'], returned: ['bad', 'returned'] })[o.status] || ['', o.status];
  const act = (o, a, label, cls = '') => `<button class="btn ${cls}" onclick="orderAction('${o.id}','${a}','${E(o.online_checkouts && a === 'paid' ? o.online_checkouts.code : o.code)}')">${label}</button>`;
  const tr = o => {
    const sh = shopOf(o), open = live.includes(o), [pc, pt] = step(o);
    let actions = '';
    if (o.status === 'placed' && !paid(o)) actions = act(o, 'paid', 'Payment received', 'gold');
    else if (o.status === 'placed') actions = act(o, 'confirmed', 'Shop confirmed', 'gold') + ` <button class="btn sec" onclick="orderSms('${o.id}','shop')">SMS shop</button>`;
    else if (['accepted', 'ready'].includes(o.status)) actions = (o.status === 'accepted' ? act(o, 'ready', 'Ready', 'sec') + ' ' : '') + act(o, 'on_the_way', o.fulfilment === 'pickup' ? 'At pickup point' : 'On the way', 'gold')
      + ` <button class="btn sec" onclick="orderSms('${o.id}','shop')">SMS shop</button>` + (o.courier_id ? ` <button class="btn sec" onclick="orderSms('${o.id}','courier')">SMS courier</button>` : '');
    else if (['in_transit', 'at_pickup_point'].includes(o.status)) actions = act(o, 'delivered', o.fulfilment === 'pickup' ? 'Collected' : 'Delivered', 'gold') + (o.courier_id ? ` <button class="btn sec" onclick="orderSms('${o.id}','courier')">SMS courier</button>` : '');
    const courierSel = open && o.fulfilment === 'delivery' && o.status !== 'in_transit'
      ? `<select onchange="setCourier('${o.id}',this.value)"><option value="">${o.courier_id ? 'Remove courier' : 'Choose courier…'}</option>${COURIERS.map(c => `<option value="${c.id}" ${c.id === o.courier_id ? 'selected' : ''}>${E(c.company && c.company !== c.name ? c.company + ' · ' + c.name : c.name)}</option>`).join('')}</select>` : '';
    const ck = o.online_checkouts;
    return `<tr class="${late(o) ? 'late' : ''}"><td><b>${E(o.code)}</b>${ck ? `<div class="note"><b>Basket ${E(ck.code)}</b></div>` : ''}<div class="note">${ago(o.created_at)} ago · ${o.channel === 'market' ? (o.organizations?.vertical === 'food' ? 'nyansatek.food' : 'nyansatek.store') : 'own page'}</div></td>
      <td>${E(o.organizations?.business_name)}<div class="note">${tel(sh.shop_phone || sh.whatsapp_number)}</div></td>
      <td>${(o.online_order_items || []).map(i => `${i.qty} × ${E(i.name_snapshot)}`).join('<br>')}${o.customer_note ? `<div class="note">Note: ${E(o.customer_note)}</div>` : ''}</td>
      <td>${E(o.customer_name)}<div class="note">${tel(o.customer_phone)}</div>${o.fulfilment === 'delivery' ? `<div class="note">${E(o.address || '')}${o.landmark ? ' · ' + E(o.landmark) : ''}${o.delivery_zones?.name ? ' · ' + E(o.delivery_zones.name) : ''}</div>` : `<div class="note">Pickup · ${E(o.pickup_points?.name || '')}</div>`}</td>
      <td><b>${GH(o.goods_total)}</b><div class="note">${paid(o) ? 'MoMo ✓' : 'MoMo not yet'}${o.momo_txn_id ? ' · ID ' + E(o.momo_txn_id) : ''}</div>${ck && !paid(o) ? `<div class="note">Look for <b>${GH(ck.total)}</b> for ${E(ck.code)}</div>` : ''}<div class="note">Shop gets ${GH(o.base_total ?? o.goods_total)}</div></td>
      <td><span class="pill ${pc}">${E(pt)}</span>${o.status === 'placed' && !paid(o) ? `<div class="note">${minsLeft(o)} min left to pay</div>` : ''}${o.cancel_reason && o.status === 'cancelled' ? `<div class="note">${E(o.cancel_reason)}${paid(o) ? ' · refund the MoMo' : ''}</div>` : ''}</td>
      <td>${o.couriers ? `${E(o.couriers.name)}<div class="note">${tel(o.couriers.phone)}</div>` : ''}${courierSel}</td>
      <td><div style="display:flex;gap:4px;flex-wrap:wrap;">${actions}${open ? ` <button class="btn bad" onclick="cancelOrder('${o.id}','${E(o.code)}')">Cancel</button>` : ''}</div></td></tr>`;
  };
  const table = list => list.length ? `<table><tr><th>Order</th><th>Shop / restaurant</th><th>Items</th><th>Customer</th><th>Paid</th><th>Status</th><th>Courier</th><th></th></tr>${list.map(tr).join('')}</table>` : '<div class="empty">None.</div>';
  M().innerHTML = `${window.Notification && Notification.permission === 'default' ? '<div class="box"><b>Get alerts for new orders</b> <button class="btn gold" onclick="Notification.requestPermission().then(()=>orders())">Turn on alerts</button> <span class="note">Keep this page open: it beeps and notifies you when an order comes in or a customer sends a MoMo ID.</span></div>' : ''}<h2>Live orders (${live.length})</h2><p class="note" style="margin-bottom:8px;">A customer's basket (NC…) is split into one order per shop (NS…); one MoMo payment covers the basket. 1. Check the MoMo and press <b>Payment received</b>. 2. Call the shop to place the order, then <b>Shop confirmed</b>.
    3. Choose a courier and call them. 4. <b>On the way</b>, then <b>Delivered</b>. SMS buttons are optional and cost SMS credit. Highlighted: needs attention. Refreshes every 20 seconds.</p>${table(live)}
    <h2 style="margin-top:20px;">Finished in the last 24 hours (${finished.length})</h2>${table(finished)}`;
}
async function orderAction(id, action, code) {
  let note = null;
  if (action === 'paid') { note = prompt(`Payment for ${code} is in NYANSATEK's MoMo?${code.startsWith('NC') ? ' This marks every part of the basket as paid.' : ''} Enter the MoMo transaction ID (optional):`, ''); if (note === null) return; }
  if (action === 'delivered' && !confirm(`Mark ${code} as delivered? The shop's sale is recorded and it is added to today's payouts.`)) return;
  const { error } = await sb.rpc('ops_order_action', { p_order: id, p_action: action, p_note: note }); if (error) fail(error); orders();
}
async function setCourier(id, courier) { const { error } = await sb.rpc('ops_assign_courier', { p_order: id, p_courier: courier || null }); if (error) fail(error); orders(); }
async function orderSms(id, to) {
  const { data, error } = await sb.rpc('ops_order_sms', { p_order: id, p_to: to, p_send: false });
  if (error) return fail(error);
  if (!confirm(`Send this SMS to ${local(data.to)}?\n\n${data.text}`)) return;
  const r = await sb.rpc('ops_order_sms', { p_order: id, p_to: to, p_send: true });
  if (r.error) fail(r.error); else alert('SMS sent.');
}
async function cancelOrder(id, code) {
  const reason = prompt(`Cancel ${code}? Reason (the customer sees this):`, 'Cancelled by NYANSATEK');
  if (reason === null) return;
  const { error } = await sb.rpc('ops_cancel_order', { p_order: id, p_reason: reason }); if (error) fail(error); orders();
}

// ---------- couriers: outside riders and delivery services the team calls ----------
async function couriers() {
  const { data, error } = await sb.from('couriers').select('*').order('active', { ascending: false }).order('company').order('name');
  if (error) return M().innerHTML = `<div class="err">${E(error.message)}</div>`;
  M().innerHTML = `<h2>Couriers</h2><p class="note" style="margin-bottom:8px;">Riders and delivery services we call to collect and deliver orders. They charge the customer their delivery fee and keep it.</p>
    <div class="box"><b>Add a courier</b><div class="row" style="margin-top:8px;">
      <label class="fg">Name<input id="k-name" placeholder="e.g. Kofi or Rider 5"></label>
      <label class="fg">Company (optional)<input id="k-co" placeholder="e.g. Classic Delivery Service"></label>
      <label class="fg">Phone<input id="k-phone" type="tel" placeholder="024XXXXXXX"></label>
      <label class="fg" style="flex:1;min-width:220px;">Notes<input id="k-notes" placeholder="Area, other numbers, hours"></label>
      <button class="btn gold" id="k-add">Add</button></div></div>
    ${(data || []).length ? `<table><tr><th>Courier</th><th>Phone</th><th>Notes</th><th>Active</th></tr>${data.map(c => `<tr style="${c.active ? '' : 'opacity:.55'}"><td><b>${E(c.name)}</b><div class="note">${E(c.company || '')}</div></td><td>${tel(c.phone)}</td><td class="note">${E(c.notes || '')}</td>
      <td><input type="checkbox" ${c.active ? 'checked' : ''} onchange="sb.from('couriers').update({active:this.checked}).eq('id','${c.id}').then(r=>{if(r.error)fail(r.error);couriers();})"></td></tr>`).join('')}</table>` : '<div class="empty">No couriers yet.</div>'}`;
  document.getElementById('k-add').onclick = async () => {
    const v = id => document.getElementById(id).value.trim(), d = v('k-phone').replace(/\D/g, '');
    const phone = /^0\d{9}$/.test(d) ? '233' + d.slice(1) : /^233\d{9}$/.test(d) ? d : null;
    if (v('k-name').length < 2) return alert('Enter a name.');
    if (!phone) return alert('Enter a valid phone number.');
    const { error } = await sb.from('couriers').insert({ name: v('k-name'), company: v('k-co') || null, phone, notes: v('k-notes') || null });
    if (error) fail(error); couriers();
  };
}

// ---------- refunds: paid orders that were cancelled ----------
async function refunds() {
  const since = new Date(Date.now() - 30 * 864e5).toISOString();
  const { data, error } = await sb.from('online_orders').select('id,code,customer_name,customer_phone,goods_total,cancel_reason,cancelled_at,refund_status,refund_ref,refunded_at,momo_txn_id,organizations(business_name),online_checkouts(code)')
    .in('refund_status', ['due', 'refunded']).or(`refund_status.eq.due,refunded_at.gte.${since}`).order('cancelled_at', { ascending: false }).limit(200);
  if (error) return M().innerHTML = `<div class="err">${E(error.message)}</div>`;
  const due = (data || []).filter(o => o.refund_status === 'due'), done = (data || []).filter(o => o.refund_status === 'refunded');

async function menuSave(i) {

async function menuPhoto(i, file) {

  const url = await uploadPhoto(MENU_ORG, file); if (!url) return;

// Photos are shrunk to at most 900 px before upload, then stored in the product-photos bucket under the business.
async function uploadPhoto(org, file) {
  try {
    const img = await createImageBitmap(file), k = Math.min(1, 900 / Math.max(img.width, img.height));
    const c = Object.assign(document.createElement('canvas'), { width: Math.round(img.width * k), height: Math.round(img.height * k) });
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .82));
    const path = `${org}/ops-${Date.now()}.jpg`;
    const { error } = await sb.storage.from('product-photos').upload(path, blob, { contentType: 'image/jpeg' });
    if (error) { fail(error); return null; }
    return sb.storage.from('product-photos').getPublicUrl(path).data.publicUrl;
  } catch (e) { fail(e); return null; }
}

async function riderCheck(id, key, ok) { const { error } = await sb.rpc('ops_rider_set_check', { p_rider: id, p_key: key, p_ok: ok }); if (error) fail(error); riderReview(id); }
async function riderId(id, result) {
  const { error } = await sb.rpc('ops_rider_id_check', { p_rider: id, p_result: result, p_method: document.getElementById('rv-method').value || null, p_ref: document.getElementById('rv-ref').value });
  if (error) fail(error); riderReview(id);
}
async function riderDecide(id, action) {
  const ask = { approve: 'Approve this rider? They will be able to go online and take jobs.', reject: 'Reject this application?', suspend: 'Suspend this rider? They go offline now and jobs they have not collected go back to the pool.', reinstate: 'Reinstate this rider?' }[action];
  if (ask && !confirm(ask)) return;
  const zs = document.getElementById('rv-zones');
  const { error } = await sb.rpc('ops_rider_decide', { p_rider: id, p_action: action, p_note: document.getElementById('rv-note').value, p_zone_ids: zs ? [...zs.selectedOptions].map(o => o.value) : null });
  if (error) return fail(error);
  await riders(); riderReview(id);
}
async function accounts(body) {
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch(SUPABASE_URL + '/functions/v1/ops-accounts', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token,
    apikey: 'sb_publishable_T6oCd3aRO0OPheQXEkmvRA_nvIhEPcv' }, body: JSON.stringify(body) });
  return res.json().catch(() => ({ error: 'Could not reach the server.' }));
}
async function riderReset(id) {
  if (!confirm('Give this rider a new password? The old one stops working.')) return;
  const out = await accounts({ action: 'reset_rider_password', rider_id: id });
  alert(out.error || `New login: ${out.login}\nPassword: ${out.password}\n(shown once)`);
}

  M().innerHTML = `<h2>Delivery areas and fees</h2><p class="note" style="margin-bottom:8px;">Typical rider fee in each area. Customers see the motorbike fee at checkout as "about GH₵…, paid to the rider". We don't collect it: the courier charges the customer and keeps it.</p>
    <div class="box"><div class="row"><label class="fg">New area<input id="z-name" placeholder="e.g. Adum / Kejetia"></label><button class="btn gold" id="z-add">Add area</button></div></div>
    <table><tr><th>Area</th>${VEH.map(v => `<th>${v} (GH₵)</th>`).join('')}<th>Active</th></tr>${(zs || []).map(z => `<tr><td>${E(z.name)}</td>${VEH.map(v => `<td><input type="number" min="0" step="0.5" style="width:90px" value="${fee(z.id, v)}" onchange="setFee('${z.id}','${v}',this.value)"></td>`).join('')}
      <td><input type="checkbox" ${z.active ? 'checked' : ''} onchange="sb.from('delivery_zones').update({active:this.checked}).eq('id','${z.id}').then(r=>r.error&&fail(r.error))"></td></tr>`).join('')}</table>`;
  document.getElementById('z-add').onclick = async () => { const name = document.getElementById('z-name').value.trim(); if (!name) return; const { error } = await sb.from('delivery_zones').insert({ name }); if (error) fail(error); zones(); };
}
async function setFee(zone, vehicle, val) {
  const r = val === '' ? await sb.from('delivery_zone_fees').delete().match({ zone_id: zone, vehicle })
    : await sb.from('delivery_zone_fees').upsert({ zone_id: zone, vehicle, fee: Number(val) }, { onConflict: 'zone_id,vehicle' });
  if (r.error) fail(r.error);
}

// ---------- phone orders: voice notes, call-back requests, and orders the team takes by phone ----------
// Customers call NYANSATEK's numbers, send a voice note or ask for a call back (nyansatek.store / .food).
// The team listens or calls, then builds the order here; it is placed exactly like an online order
// (place_checkout), so the customer gets the MoMoPay SMS and a tracking link.
let PO = { site: 'store', basket: [], request: null, results: [] };
async function phone() {
  const { data, error } = await sb.from('order_requests').select('*').or(`status.in.(new,no_answer),created_at.gte.${new Date(Date.now() - 2 * 864e5).toISOString()}`)
    .order('created_at', { ascending: false }).limit(200);
  if (error) return M().innerHTML = `<div class="err">${E(error.message)}</div>`;
  const rows = data || [];
  const urls = {};
  const withAudio = rows.filter(r => r.audio_path);
  if (withAudio.length) {
    const { data: signed } = await sb.storage.from('voice-orders').createSignedUrls(withAudio.map(r => r.audio_path), 3600);
    (signed || []).forEach(s => { if (s.signedUrl) urls[s.path] = s.signedUrl; });
  }
  window.PO_ROWS = rows;
  const open = rows.filter(r => ['new', 'no_answer'].includes(r.status)), done = rows.filter(r => !open.includes(r));
  const cartTxt = r => (r.cart || []).map(i => `${i.qty} × ${E(i.name)}${i.shop ? ' <span class="note">(' + E(i.shop) + ')</span>' : ''}`).join('<br>');
  const tr = r => `<tr class="${r.status === 'new' ? 'late' : ''}"><td><span class="pill ${r.kind === 'voice' ? 'warn' : ''}">${({ voice: 'Voice note', callback: 'Call me back', call: 'Phone call' })[r.kind]}</span><div class="note">${ago(r.created_at)} ago · nyansatek.${E(r.site)}</div></td>
    <td>${E(r.customer_name || '—')}<div class="note">${tel(r.phone)}</div>${r.location ? `<div class="note">${E(r.location)}</div>` : ''}</td>
    <td>${r.audio_path ? (urls[r.audio_path] ? `<audio controls preload="none" src="${E(urls[r.audio_path])}" style="max-width:260px;"></audio>` : '<span class="note">Recording unavailable</span>') + (r.audio_seconds ? `<div class="note">${r.audio_seconds}s</div>` : '') : ''}
      ${(r.cart || []).length ? `<div class="note" style="margin-top:4px;"><b>${r.kind === 'call' ? 'Ordered:' : 'In their cart:'}</b><br>${cartTxt(r)}</div>` : ''}</td>
    <td><span class="pill ${r.status === 'done' ? 'ok' : r.status === 'spam' ? 'bad' : r.status === 'no_answer' ? 'warn' : ''}">${({ new: 'new', no_answer: 'no answer yet', done: 'done', spam: 'spam' })[r.status]}</span>${r.checkout_code ? `<div class="note">Order ${E(r.checkout_code)}</div>` : ''}${r.team_note ? `<div class="note">${E(r.team_note)}</div>` : ''}</td>
    <td><div style="display:flex;gap:4px;flex-wrap:wrap;">${['new', 'no_answer'].includes(r.status) ? `<button class="btn gold" onclick="poFromRequest('${r.id}')">Make the order</button>
      <button class="btn sec" onclick="poMark('${r.id}','no_answer')">No answer</button><button class="btn sec" onclick="poMark('${r.id}','done')">Done, no order</button><button class="btn bad" onclick="poMark('${r.id}','spam')">Spam</button>` : ''}</div></td></tr>`;
  const table = list => list.length ? `<table><tr><th>Request</th><th>Customer</th><th>Voice note / cart</th><th>Status</th><th></th></tr>${list.map(tr).join('')}</table>` : '<div class="empty">None.</div>';
  M().innerHTML = `<h2>Phone orders</h2>
    <p class="note" style="margin-bottom:8px;"><b>Waiting</b> shows voice notes and call-back requests from customers. Listen or call them back, then press <b>Make the order</b>.
      When a customer calls you directly, use <b>New phone order</b>. Either way the order is placed like an online order: the customer gets the MoMoPay SMS and tracking link,
      the order goes to the <b>Orders</b> tab waiting for payment, and it is listed under Handled below with its order number.</p>
    <div id="po-form"></div>
    <button class="btn gold" id="po-new" onclick="poOpen()">New phone order</button>
    <h2 style="margin-top:18px;">Waiting (${open.length})</h2>${table(open)}
    <h2 style="margin-top:18px;">Handled in the last 2 days (${done.length})</h2>${table(done)}`;
  if (PO.formOpen) poRender();
}
async function poMark(id, status) {
  let note = null;
  if (status === 'done') { note = prompt('Note (optional), e.g. "customer will order later":', ''); if (note === null) return; }
  const { error } = await sb.from('order_requests').update({ status, team_note: note || null, handled_by: (await sb.auth.getUser()).data.user?.id, handled_at: new Date().toISOString() }).eq('id', id);
  if (error) fail(error); phone();
}
function poOpen(req) {
  PO = { site: req?.site || 'store', basket: [], request: req || null, results: [], formOpen: true,
    name: req?.customer_name || '', phone: req ? local(req.phone) : '', loc: req?.location || '' };
  (req?.cart || []).forEach(i => { if (i.product_id && i.org_id) PO.basket.push({ product_id: i.product_id, org_id: i.org_id, name: i.name, shop: i.shop, price: Number(i.price) || 0, qty: i.qty }); });
  poRender(); document.getElementById('po-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function poFromRequest(id) { poOpen((window.PO_ROWS || []).find(r => r.id === id)); }
function poClose() { PO.formOpen = false; document.getElementById('po-form').innerHTML = ''; document.getElementById('po-new').style.display = ''; }
function poKeep() { ['name', 'phone', 'loc', 'land', 'note'].forEach(k => { const el = document.getElementById('po-' + k); if (el) PO[k] = el.value; }); }
function poRender() {
  const box = document.getElementById('po-form'); if (!box) return;
  document.getElementById('po-new').style.display = 'none';
  const total = PO.basket.reduce((a, i) => a + i.price * i.qty, 0);
  box.innerHTML = `<div class="box" style="border-color:var(--a);">
    <div style="display:flex;justify-content:space-between;align-items:center;"><b>${PO.request ? 'Order for ' + E(PO.request.customer_name || local(PO.request.phone)) : 'New phone order'}</b><button class="btn sec" onclick="poClose()">Close</button></div>
    <div class="row" style="margin-top:8px;">
      <label class="fg">Site<select id="po-site" onchange="poKeep();PO.site=this.value;PO.results=[];poRender()"><option value="store" ${PO.site === 'store' ? 'selected' : ''}>nyansatek.store</option><option value="food" ${PO.site === 'food' ? 'selected' : ''}>nyansatek.food</option></select></label>
      <label class="fg" style="flex:2;">Find a product or dish<input id="po-q" placeholder="Type a name, e.g. jollof, rice, fridge" oninput="poSearch(this.value)"></label></div>
    <div id="po-res">${PO.results.map((p, i) => `<div class="line" style="display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--b);"><span>${E(p.name)} <span class="note">· ${E(p.shop_name)}${p.in_stock ? '' : ' · out of stock'}</span></span><span><b>${GH(p.price)}</b> <button class="btn sec" onclick="poAdd(${i})" ${p.in_stock ? '' : 'disabled'}>Add</button></span></div>`).join('')}</div>
    <div style="margin-top:10px;"><b>Order</b>${PO.basket.length ? PO.basket.map((i, k) => `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;"><span>${E(i.name)} <span class="note">· ${E(i.shop || '')}</span></span>
      <span><button class="btn sec" onclick="poQty(${k},-1)">−</button> <b>${i.qty}</b> <button class="btn sec" onclick="poQty(${k},1)">+</button> ${GH(i.price * i.qty)}</span></div>`).join('') + `<div style="text-align:right;margin-top:4px;"><b>Customer pays ${GH(total)}</b> <span class="note">by MoMo · rider's fee paid on delivery</span></div>` : '<div class="note">Nothing added yet.</div>'}</div>
    <div class="row" style="margin-top:8px;">
      <label class="fg">Customer name<input id="po-name" value="${E(PO.name || '')}"></label>
      <label class="fg">Customer phone<input id="po-phone" type="tel" value="${E(PO.phone || '')}"></label>
      <label class="fg">Location<input id="po-loc" placeholder="Area or town" value="${E(PO.loc || '')}"></label>
      <label class="fg">Directions for the rider<input id="po-land" value="${E(PO.land || '')}"></label>
      <label class="fg" style="flex:2;">Note for the shop / restaurant<input id="po-note" maxlength="300" value="${E(PO.note || '')}"></label></div>
    <div class="err" id="po-err"></div>
    <button class="btn gold" onclick="poPlace()" ${PO.basket.length ? '' : 'disabled'}>Place order and text the customer</button></div>`;
}
let poTimer = null;
function poSearch(q) {
  clearTimeout(poTimer);
  poTimer = setTimeout(async () => {
    if (q.trim().length < 2) { PO.results = []; } else {
      const { data, error } = await sb.rpc(PO.site === 'food' ? 'food_listings' : 'market_listings', { p_q: q.trim(), p_limit: 25 });
      if (error) return fail(error);
      PO.results = data || [];
    }
    poKeep(); const keepQ = document.getElementById('po-q').value; poRender();
    const qi = document.getElementById('po-q'); qi.value = keepQ; qi.focus();
  }, 300);
}
function poAdd(i) {
  poKeep(); const p = PO.results[i]; const ex = PO.basket.find(b => b.product_id === p.id);
  if (ex) ex.qty++; else PO.basket.push({ product_id: p.id, org_id: p.org_id, name: p.name, shop: p.shop_name, price: Number(p.price), qty: 1 });
  const keepQ = document.getElementById('po-q').value; poRender(); document.getElementById('po-q').value = keepQ;
}
function poQty(k, d) { poKeep(); PO.basket[k].qty += d; if (PO.basket[k].qty <= 0) PO.basket.splice(k, 1); poRender(); }
async function poPlace() {
  poKeep();
  const err = document.getElementById('po-err'); err.textContent = '';
  if (!PO.basket.length) return err.textContent = 'Add at least one item.';
  if (String(PO.loc || '').trim().length < 2) return err.textContent = "Enter the customer's location.";
  const p = { items: PO.basket.map(i => ({ org_id: i.org_id, product_id: i.product_id, qty: i.qty })), customer: { name: PO.name, phone: PO.phone },
    fulfilment: 'delivery', payment_method: 'momo', address: PO.loc, landmark: PO.land || '', note: PO.note || '' };
  if (!confirm(`Place this order for ${PO.name || PO.phone} and text them how to pay?`)) return;
  const { data, error } = await sb.rpc('place_checkout', { p });
  if (error) return err.textContent = error.message;
  const me = (await sb.auth.getUser()).data.user?.id, nowIso = new Date().toISOString();
  if (PO.request) await sb.from('order_requests').update({ status: 'done', checkout_code: data.code, handled_by: me, handled_at: nowIso }).eq('id', PO.request.id);
  else await sb.from('order_requests').insert({ kind: 'call', site: PO.site, customer_name: PO.name || null, phone: '233' + String(PO.phone).replace(/\D/g, '').replace(/^(233|0)/, ''),
    location: PO.loc || null, cart: PO.basket.map(i => ({ org_id: i.org_id, product_id: i.product_id, name: i.name, shop: i.shop, qty: i.qty, price: i.price })),
    status: 'done', checkout_code: data.code, handled_by: me, handled_at: nowIso });
  alert(`Order ${data.code} placed. The customer has been texted to pay ${GH(data.total)} by MoMoPay. Follow it in the Orders tab (waiting for payment).`);
  PO.formOpen = false; phone();
}

// ---------- settings: where customers pay, the markup and the payment window ----------
async function billing() {
  const { data: cfg, error } = await sb.from('market_settings').select('*').maybeSingle();
  if (error) return M().innerHTML = `<div class="err">${E(error.message)}</div>`;
  const c = cfg || {};
  M().innerHTML = `<h2>Settings</h2>
    <div class="box"><b>Payments and pricing</b><div class="row" style="margin-top:8px;">
      <label class="fg">NYANSATEK MoMo number<input id="b-momo" type="tel" value="${c.nyansatek_momo_number ? local(c.nyansatek_momo_number) : ''}"></label>
      <label class="fg">MoMo account name<input id="b-momoname" value="${E(c.nyansatek_momo_name || '')}"></label>
      <label class="fg">MoMoPay merchant ID (shown to customers)<input id="b-merchant" value="${E(c.nyansatek_momo_merchant_id || '')}"></label>
      <label class="fg">Team phone for new-order SMS (optional)<input id="b-alert" type="tel" value="${c.team_alert_phone ? local(c.team_alert_phone) : ''}"></label>
      <label class="fg">Food markup per dish (GH₵)<input id="b-food" type="number" min="0" step="0.5" value="${c.food_markup_per_item ?? 5}"></label>
      <label class="fg">Store markup (%)<input id="b-store" type="number" min="0" max="50" step="0.5" value="${Number(c.store_markup_rate ?? 0.05) * 100}"></label>
      <label class="fg">Minutes to pay before an order is cancelled<input id="b-mins" type="number" min="5" max="240" value="${c.accept_minutes ?? 30}"></label>
      <button class="btn gold" id="b-save">Save</button></div>
      <p class="note" style="margin-top:6px;">Customers see each shop price plus the markup. Shops are paid their own prices (Payouts). Changing the markup changes prices shown from now on; orders already placed keep their prices.</p></div>
    <div class="box"><b>Order by phone</b><div class="row" style="margin-top:8px;">
      <label class="fg" style="flex:2;">Numbers customers call to order (one per line)<textarea id="b-phones" rows="3">${E((c.order_phones || []).map(local).join('\n'))}</textarea></label>
      <label class="fg">Lines open at<input id="b-popen" type="time" value="${E(String(c.phone_opens_at || '09:00').slice(0, 5))}"></label>
      <label class="fg">Lines close at<input id="b-pclose" type="time" value="${E(String(c.phone_closes_at || '21:00').slice(0, 5))}"></label>
      <button class="btn gold" id="b-psave">Save</button></div>
      <p class="note" style="margin-top:6px;">The Call button on nyansatek.store and nyansatek.food shows these numbers only between these times (Ghana time). Outside them, customers can still send a voice note or ask for a call back.</p></div>
`;
  document.getElementById('b-save').onclick = async () => {
    const v = id => document.getElementById(id).value.trim();
    const d = String(v('b-momo')).replace(/\D/g, ''), momo = /^0\d{9}$/.test(d) ? '233' + d.slice(1) : /^233\d{9}$/.test(d) ? d : null;
    if (!momo) return alert('Enter a valid MoMo number.');
    const ad = v('b-alert').replace(/\D/g, ''), alertPhone = !ad ? null : /^0\d{9}$/.test(ad) ? '233' + ad.slice(1) : /^233\d{9}$/.test(ad) ? ad : undefined;
    if (alertPhone === undefined) return alert('Enter a valid team phone number, or leave it empty.');
    const { error } = await sb.from('market_settings').update({ nyansatek_momo_number: momo, nyansatek_momo_name: v('b-momoname') || null,
      nyansatek_momo_merchant_id: v('b-merchant') || null, team_alert_phone: alertPhone,
      food_markup_per_item: Number(v('b-food') || 0), store_markup_rate: Number(v('b-store') || 0) / 100, accept_minutes: Number(v('b-mins') || 30),
      updated_at: new Date().toISOString() }).eq('id', true);
    if (error) fail(error); else alert('Saved.'); billing();
  };
  document.getElementById('b-psave').onclick = async () => {
    const lines = document.getElementById('b-phones').value.split(/[\n,]+/).map(x => x.replace(/\D/g, '')).filter(Boolean);
    const phones = lines.map(d => /^0\d{9}$/.test(d) ? '233' + d.slice(1) : /^233\d{9}$/.test(d) ? d : null);
    if (!phones.length || phones.includes(null)) return alert('Enter at least one valid phone number, one per line (e.g. 0536340578).');
    const o = document.getElementById('b-popen').value, cl = document.getElementById('b-pclose').value;
    if (!o || !cl || o >= cl) return alert('Lines must open before they close.');
    const { error } = await sb.from('market_settings').update({ order_phones: [...new Set(phones)], phone_opens_at: o, phone_closes_at: cl, updated_at: new Date().toISOString() }).eq('id', true);
    if (error) fail(error); else alert('Saved.'); billing();
  };
}

// ---------- team (master account only) ----------
async function team() {
  const { data, error } = await sb.rpc('ops_team_list');
  if (error) return M().innerHTML = `<div class="err">${E(error.message)}</div>`;
  const rows = data || []; TEAM = Object.fromEntries(rows.map(r => [r.id, r.full_name]));
  M().innerHTML = `<h2>Team members</h2>
    <div class="box"><p class="note" style="margin-bottom:8px;">Give each person their own login. They sign in at <b>nyansatek.store/ops/</b> with their email and choose a private password the first time. Team members can use every tab except this one and Settings; only your master login can add, reset or switch off team accounts.</p>
    <div class="row"><label class="fg">Full name<input id="t-name"></label><label class="fg">Email<input id="t-email" type="email"></label><button class="btn gold" id="t-go">Create login</button></div>
    <div id="t-out" style="margin-top:8px;"></div></div>
    ${rows.length ? `<table><tr><th>Name</th><th>Email (their login)</th><th>Status</th><th>Last signed in</th><th></th></tr>${rows.map(r => `<tr>
      <td><b>${E(r.full_name)}</b></td><td>${E(r.email)}</td>
      <td>${r.is_active ? (r.must_change_password ? '<span class="pill warn">Not signed in yet</span>' : '<span class="pill ok">Active</span>') : '<span class="pill bad">Switched off</span>'}</td>
      <td>${r.last_sign_in_at ? new Date(r.last_sign_in_at).toLocaleString() : '—'}</td>
      <td style="white-space:nowrap"><button class="btn sec" onclick="resetMember('${r.id}')">New password</button>
        ${r.is_active ? `<button class="btn bad" onclick="setMember('${r.id}',false)">Switch off</button>` : `<button class="btn sec" onclick="setMember('${r.id}',true)">Switch on</button>`}</td></tr>`).join('')}</table>`
      : '<div class="empty">No team members yet.</div>'}`;
  document.getElementById('t-go').onclick = async () => {
    const btn = document.getElementById('t-go'); btn.disabled = true;
    const out = await accounts({ action: 'create_team_member', full_name: document.getElementById('t-name').value, email: document.getElementById('t-email').value });
    btn.disabled = false;
    if (out.error) return document.getElementById('t-out').innerHTML = `<div class="err">${E(out.error)}</div>`;
    await team();
    document.getElementById('t-out').innerHTML = handover(out);
  };
}
const handover = out => `<div class="box" style="background:#fffbea;border-color:#f3dc9b;margin:0;"><b>Give these to the team member (shown once):</b><br>
  Website: <b>nyansatek.store/ops/</b><br>Email: <span class="secret">${E(out.login)}</span><br>Temporary password: <span class="secret">${E(out.password)}</span><br>
  <span class="note">They will be asked to choose their own password when they first sign in.</span></div>`;
let TEAM = {};
async function resetMember(id) {
  const name = TEAM[id] || 'this team member';
  if (!confirm('Give ' + name + ' a new temporary password? Their current password stops working.')) return;
  const out = await accounts({ action: 'reset_team_password', member_id: id });
  if (out.error) return fail(out.error);
  await team(); document.getElementById('t-out').innerHTML = handover(out);
}
async function setMember(id, on) {
  const name = TEAM[id] || 'this team member';
  if (!on && !confirm('Switch off ' + name + '? They will not be able to use the dashboard until you switch them back on.')) return;
  const { error } = await sb.rpc('ops_team_set_active', { p_id: id, p_active: on }); if (error) return fail(error); team();
}

start();
</script>
</body>
</html>
