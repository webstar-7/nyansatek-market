<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>nyansatek.store · Shop from trusted local shops</title>
<meta name="description" content="Shop from trusted local shops in one place. Pay by MoMo and a rider brings it to your door.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17264a">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--p:#17264a;--a:#d1a03a;--bg:#f3f4f7;--b:#e2e6ec;--g:#667487;--ok:#127a46;--bad:#b42318;--font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font);}
body{background:var(--bg);color:#111827;min-height:100vh;}
a{color:var(--p);}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px;}
header.top{background:var(--p);color:#fff;position:sticky;top:0;z-index:15;}
header.top .row{display:flex;gap:12px;align-items:center;padding:12px 0;}
.brand{color:#fff;text-decoration:none;font-weight:800;font-size:1.15rem;white-space:nowrap;}
.brand span{color:var(--a);}
.search{flex:1;padding:10px 14px;border:0;border-radius:12px;font-size:1rem;min-width:0;}
.cartbtn{background:var(--a);color:#1a1405;border:0;border-radius:12px;padding:10px 12px;font-weight:800;cursor:pointer;white-space:nowrap;}
.nav{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none;}
.nav a{flex:none;color:#fff;opacity:.85;text-decoration:none;font-size:.85rem;padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.25);}
.nav a.on{opacity:1;background:rgba(255,255,255,.15);}
h1{font-size:1.3rem;margin:18px 0 6px;}
h2.sec{font-size:1.05rem;margin:22px 0 10px;}
.hero{background:linear-gradient(135deg,#17264a,#22386b);color:#fff;border-radius:18px;padding:22px;margin:16px 0;}
.hero b{color:var(--a);}
.hero p{opacity:.9;margin-top:6px;font-size:.95rem;line-height:1.45;}
/* home hero reel (made with Remotion): a short tour of browsing, paying and tracking */
.hero.has-reel{display:flex;align-items:center;padding:0;overflow:hidden;}
.hero.has-reel .hero-t{flex:1;min-width:0;padding:26px 30px;}
.hero.has-reel .hero-t b{display:block;font-size:1.55rem;line-height:1.2;letter-spacing:-.01em;}
.hero.has-reel .hero-t p{font-size:1rem;max-width:44ch;margin-top:10px;}
.hero-reel{flex:none;width:320px;aspect-ratio:1/1;object-fit:cover;display:block;background:#0d1630;}
@media(max-width:720px){.hero.has-reel{flex-direction:column-reverse;align-items:stretch;}.hero.has-reel .hero-t{padding:18px 20px 20px;}.hero.has-reel .hero-t b{font-size:1.2rem;}.hero.has-reel .hero-t p{font-size:.95rem;}.hero-reel{width:100%;aspect-ratio:16/9;}}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.cat{background:#fff;border:1px solid var(--b);border-radius:14px;padding:14px;text-decoration:none;color:#111827;font-weight:600;font-size:.92rem;}
.cat small{display:block;color:var(--g);font-weight:400;margin-top:4px;font-size:.78rem;}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;}
.chip{border:1px solid var(--b);background:#fff;border-radius:999px;padding:6px 12px;font-size:.85rem;text-decoration:none;color:#344054;}
.chip.on{background:var(--p);color:#fff;border-color:var(--p);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;padding-bottom:30px;}
.card{background:#fff;border:1px solid var(--b);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#eef0f4;display:block;}
/* stand-in for a product or dish that has no photo yet */
.ph{width:100%;aspect-ratio:1/1;display:grid;place-items:center;background:linear-gradient(135deg,#eef0f4,#dfe3ea);color:#667487;font-weight:700;font-size:.85rem;line-height:1.25;text-align:center;padding:12px;}
.pdp .ph{border-radius:16px;font-size:1.1rem;}
.line .ph{width:52px;height:52px;aspect-ratio:auto;border-radius:8px;flex:none;font-size:.55rem;padding:3px;overflow:hidden;}
.card .body{padding:10px;display:flex;flex-direction:column;gap:3px;flex:1;}
.card .name{font-size:.9rem;font-weight:600;line-height:1.25;}
.card .shop{font-size:.76rem;color:var(--g);}
.card .price{font-weight:800;color:var(--p);margin-top:auto;}
.card .oos{font-size:.76rem;color:var(--bad);font-weight:600;}
.btn{border:0;border-radius:10px;padding:10px 14px;font-size:.92rem;font-weight:700;cursor:pointer;background:var(--p);color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.btn.sec{background:#fff;color:var(--p);border:1px solid var(--b);}
.btn.gold{background:var(--a);color:#1a1405;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.pdp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin:18px 0 40px;}
.pdp img{width:100%;border-radius:16px;background:#eef0f4;aspect-ratio:1/1;object-fit:cover;}
.pdp .price{font-size:1.5rem;font-weight:800;color:var(--p);margin:8px 0;}
@media(max-width:720px){.pdp{grid-template-columns:1fr;}}
.qty{display:flex;align-items:center;gap:6px;}
.qty button{width:34px;height:34px;border-radius:8px;border:1px solid var(--b);background:#fff;font-size:1.1rem;cursor:pointer;}
.qty span{min-width:24px;text-align:center;font-weight:700;}
.box{background:#fff;border:1px solid var(--b);border-radius:14px;padding:16px;margin:14px 0;}
.line{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--b);}
.line img{width:52px;height:52px;border-radius:8px;object-fit:cover;background:#eef0f4;flex:none;}
.line .n{flex:1;font-size:.9rem;}
.fg{margin:10px 0;}
.fg label{display:block;font-size:.8rem;font-weight:600;color:#344054;margin-bottom:4px;}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border:1px solid var(--b);border-radius:10px;font-size:1rem;background:#fff;}
.seg{display:flex;gap:6px;flex-wrap:wrap;}
.seg label{flex:1;min-width:150px;border:1px solid var(--b);border-radius:10px;padding:10px;cursor:pointer;font-size:.9rem;display:flex;gap:6px;align-items:flex-start;}
.seg label.dis{opacity:.5;cursor:not-allowed;}
.sum{background:#f8f9fb;border:1px solid var(--b);border-radius:12px;padding:12px;margin:12px 0;font-size:.92rem;}
.sum div{display:flex;justify-content:space-between;padding:2px 0;}
.sum .tot{font-weight:800;font-size:1rem;border-top:1px solid var(--b);margin-top:6px;padding-top:6px;}
.note{font-size:.82rem;color:var(--g);line-height:1.4;}
.err{color:var(--bad);font-size:.88rem;margin:8px 0;font-weight:600;}
.empty{text-align:center;color:var(--g);padding:50px 16px;}
.steps{list-style:none;margin:6px 0;}
.steps li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:.92rem;color:#98a2b3;}
.steps li .dot{width:12px;height:12px;border-radius:50%;background:#d0d5dd;margin-top:4px;flex:none;}
.steps li.done{color:#111827;} .steps li.done .dot{background:var(--ok);}
.steps li.now{color:#111827;font-weight:700;} .steps li.now .dot{background:var(--a);box-shadow:0 0 0 4px rgba(209,160,58,.25);}
.big{font-size:1.6rem;font-weight:800;letter-spacing:.12em;color:var(--p);}
.status{display:inline-block;border-radius:999px;padding:4px 10px;font-size:.8rem;font-weight:700;background:#eef0f4;}
.status.good{background:#e7f6ee;color:var(--ok);} .status.bad{background:#fdecea;color:var(--bad);}
.more{display:flex;justify-content:center;margin:6px 0 30px;}
footer{text-align:center;font-size:.8rem;color:var(--g);padding:24px 0 40px;line-height:1.6;}
/* "List your shop" page and the band on the home page */
.join-band{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:22px 0 34px;padding:16px 18px;border-radius:14px;background:#fbf6ea;border:1px solid #ecd9a8;color:#3d2c06;text-decoration:none;font-size:.92rem;line-height:1.45;}
.join-band b{display:block;font-size:1rem;}
.join-go{flex:none;background:var(--p);color:#fff;font-weight:700;border-radius:10px;padding:9px 14px;}
.join h2.sec{margin-top:26px;}
.join-steps{list-style:none;padding:0;margin:10px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;counter-reset:st;}
.join-steps li{background:#fff;border:1px solid var(--b);border-radius:14px;padding:14px 14px 14px 52px;position:relative;font-size:.9rem;line-height:1.45;color:#344054;counter-increment:st;}
.join-steps li::before{content:counter(st);position:absolute;left:14px;top:13px;width:26px;height:26px;border-radius:50%;background:var(--p);color:#fff;font-weight:800;display:grid;place-items:center;font-size:.85rem;}
.join-steps b{display:block;color:#111827;margin-bottom:2px;}
.join-gets{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px;margin:10px 0;}
.join-gets div{background:#fff;border:1px solid var(--b);border-radius:14px;padding:14px;font-size:.88rem;line-height:1.45;color:#344054;}
.join-gets b{display:block;color:#111827;margin-bottom:2px;}
.join-price{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:10px 0;}
.join-price .box{margin:0;}
.join-price .amt{font-size:1.6rem;font-weight:800;color:var(--p);margin:4px 0 2px;}
.join-price .btn{display:block;text-align:center;margin-top:12px;}
.hero .join-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
.hero .join-cta a{text-decoration:none;}
/* pop-up tile linking to nyansatek.food (video made with Remotion) */
.foodtile{position:fixed;right:16px;bottom:16px;z-index:50;width:220px;border-radius:18px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.3);transform:translateY(140%);opacity:0;transition:transform .55s cubic-bezier(.16,1,.3,1),opacity .3s;}
.foodtile:not(.show){visibility:hidden;}
.foodtile.show{transform:none;opacity:1;}
.foodtile a{display:block;}
.foodtile video{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#c14d0e;}
.foodtile-x{position:absolute;top:7px;right:7px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:18px;line-height:28px;padding:0;cursor:pointer;}
.foodtile-x:hover{background:rgba(0,0,0,.65);}
@media(max-width:720px){.foodtile{width:170px;right:12px;bottom:12px;}}
@media(prefers-reduced-motion:reduce){.foodtile{transition:none;}}
.age{display:flex;gap:8px;align-items:flex-start;background:#fff7e6;border:1px solid #f3dc9b;border-radius:10px;padding:10px 12px;margin:12px 0;font-size:.88rem;cursor:pointer;}.age input{margin-top:3px;}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="row">
    <a class="brand" href="#/" data-link>nyansatek<span>.store</span></a>
    <input class="search" id="q" type="search" placeholder="Search products" enterkeyhint="search">
    <button class="cartbtn" onclick="go('/cart')" id="cartbtn">Cart</button>
  </div>
  <nav class="nav" id="nav"></nav>
</div></header>
<main class="wrap" id="app"><div class="empty">Loading…</div></main>
<footer class="wrap">Every shop on nyansatek.store runs on NYANSATEK POS, so stock is live.<br>
Pay by MoMo · Delivered to your door · Pay the rider's delivery fee on arrival<br>
<a href="#/orders" data-link>My orders</a> · <a href="#/partners" data-link>List your shop</a></footer>
<div class="foodtile" id="foodtile">
  <a href="https://nyansatek.food" target="_blank" rel="noopener" aria-label="Hungry? Get some food here on nyansatek.food">
    <video muted loop playsinline preload="none" poster="assets/food-tile.jpg" data-src="assets/food-tile.mp4" aria-hidden="true"></video>
  </a>
  <button class="foodtile-x" id="foodtile-x" type="button" aria-label="Close">×</button>
</div>

<script>
const SUPABASE_URL = "https://kqwqbohoeltlbwcopeug.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_T6oCd3aRO0OPheQXEkmvRA_nvIhEPcv"; // publishable key: safe to be public
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false } });
const PAGE = 40;

const E = s => s == null ? '' : String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const GH = n => 'GH₵' + Number(n || 0).toFixed(2);
// A product or dish photo, or a plain tile with its name when it has no photo yet.
const PIMG = (p, alt) => p.photo_url ? `<img src="${E(p.photo_url)}" alt="${E(alt ?? p.name)}" loading="lazy">` : `<div class="ph" aria-hidden="true">${E(p.name)}</div>`;
const NYANSATEK_PHONE = '053 634 0578';
const RANK = { motorbike: 1, car: 2, van: 3, truck: 4 };
const store = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } },
                set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
const errMsg = e => (e && (e.message || e.error_description)) || 'Something went wrong. Please try again.';
const app = document.getElementById('app');

// reference data, loaded once
const REF = { cats: [], zones: [], fees: [], points: [], open: {}, ready: null };
REF.ready = (async () => {
  const [c, z, f, p, o] = await Promise.all([
    sb.from('market_categories').select('id,name,slug,parent_id,sort').eq('active', true).eq('vertical', 'shop').order('sort').order('name'),
    sb.from('delivery_zones').select('id,name').eq('active', true).order('sort').order('name'),
    sb.from('delivery_zone_fees').select('zone_id,vehicle,fee'),
    sb.from('pickup_points').select('id,name,address,landmark,hours').eq('active', true).order('name'),
    sb.rpc('shops_open_now')]);
  REF.cats = c.data || []; REF.zones = z.data || []; REF.fees = f.data || []; REF.points = p.data || [];
  (o.data || []).forEach(x => { REF.open[x.org_id] = x; });
  const tops = REF.cats.filter(x => !x.parent_id);
  document.getElementById('nav').innerHTML = tops.map(t => `<a href="#/c/${E(t.slug)}" data-link data-slug="${E(t.slug)}">${E(t.name)}</a>`).join('');
})();

// ---------- carts: one per shop ----------
// cart = { [org_id]: { shop: {name, slug}, items: { [product_id]: {qty, p:{...listing}} } } }
let CART = store.get('market-cart') || {};
const saveCart = () => { store.set('market-cart', CART); updateCartBtn(); };
const cartCount = () => Object.values(CART).reduce((a, c) => a + Object.values(c.items).reduce((b, i) => b + i.qty, 0), 0);
function updateCartBtn() { const n = cartCount(); document.getElementById('cartbtn').textContent = n ? `Cart (${n})` : 'Cart'; }
function addToCart(p, d = 1) {
  const c = CART[p.org_id] || (CART[p.org_id] = { shop: { name: p.shop_name, slug: p.shop_slug }, items: {} });
  const cur = c.items[p.id]?.qty || 0, n = Math.max(0, Math.min(999, cur + d));
  if (n) c.items[p.id] = { qty: n, p }; else delete c.items[p.id];
  if (!Object.keys(c.items).length) delete CART[p.org_id];
  saveCart();
}

// ---------- router ----------
// ---------- pop-up tile for nyansatek.food ----------
// Shows a few seconds after landing on a browsing page (not cart, checkout, tracking or my orders).
// Closing it hides it for a day on this device.
const FOOD_TILE_HIDE_MS = 24 * 3600 * 1000;
function foodTile() {
  const el = document.getElementById('foodtile'); if (!el) return;
  const v = el.querySelector('video');
  const page = curPath().split('/').filter(Boolean)[0];
  const hiddenAt = store.get('foodTileHidden');
  const dismissed = hiddenAt && Date.now() - hiddenAt < FOOD_TILE_HIDE_MS;
  if (['cart', 'checkout', 't', 'orders', 'partners'].includes(page) || dismissed) {
    clearTimeout(foodTile.timer); el.classList.remove('show'); v.pause(); return;
  }
  if (el.classList.contains('show')) return;
  clearTimeout(foodTile.timer);
  foodTile.timer = setTimeout(() => {
    el.classList.add('show');
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      if (!v.getAttribute('src')) v.src = v.dataset.src;
      v.play().catch(() => {});
    }
  }, 4000);
}
document.getElementById('foodtile-x').addEventListener('click', () => {
  store.set('foodTileHidden', Date.now());
  const el = document.getElementById('foodtile'); el.classList.remove('show'); el.querySelector('video').pause();
});

// GitHub Pages hosting: addresses use #, e.g. nyansatek.store/#/c/drinks
function go(path) { if (location.hash === '#' + path) route(); else location.hash = '#' + path; }
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });
const curPath = () => (location.hash.slice(1) || '/').split('?')[0];
const curQuery = () => new URLSearchParams((location.hash.split('?')[1]) || '');
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') go('/search?q=' + encodeURIComponent(e.target.value.trim())); });

async function route() {
  await REF.ready;
  foodTile();
  const path = curPath().split('/').filter(Boolean).map(decodeURIComponent);
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', path[0] === 'c' && topSlugOf(path[1]) === a.dataset.slug));
  clearTimeout(trackTimer);
  if (!path.length) return home();
  if (path[0] === 'c') return category(path[1]);
  if (path[0] === 'search') return search(curQuery().get('q') || '');
  if (path[0] === 'shop') return shopPage(path[1]);
  if (path[0] === 'p') return product(path[1], path[2]);
  if (path[0] === 'cart') return cartPage();
  if (path[0] === 'checkout') return checkout();
  if (path[0] === 't') return tracking(path[1]);
  if (path[0] === 'k') return checkoutTracking(path[1]);
  if (path[0] === 'orders') return myOrders();
  if (path[0] === 'partners') return partnersPage();
  app.innerHTML = '<div class="empty">Page not found.</div>';
}
function topSlugOf(slug) { const c = REF.cats.find(x => x.slug === slug); if (!c) return null; if (!c.parent_id) return c.slug; return REF.cats.find(x => x.id === c.parent_id)?.slug; }

// ---------- "List your shop" ----------
// Listing is free. Customers pay NYANSATEK by MoMo; the team places each order with the shop by phone, calls a
// rider, and pays the shop its own prices by close of business.
// NYANSATEK POS is optional: shops on it get their online shop switched on for free.
const JOIN_CHECKOUT = 'https://nyansatek.systems/checkout.html?product=pos&source=store&plan=';
const JOIN_WHATSAPP = 'https://wa.me/233536340578?text=' + encodeURIComponent('Hello NYANSATEK, I want to list my shop on nyansatek.store.');
function partnersPage() {
  document.title = 'List your shop · nyansatek.store';
  app.innerHTML = `<div class="join">
    <div class="hero"><b style="display:block;font-size:1.5rem;line-height:1.2;">Sell on nyansatek.store</b>
      <p style="max-width:56ch;">Put your shop in front of customers across town. Customers pay NYANSATEK by MoMo, we place each order with you
      by phone and send a rider to collect it. You get your full price by close of business.</p>
      <div class="join-cta"><a class="btn" style="background:#fff;color:var(--p);" href="${JOIN_WHATSAPP}" target="_blank" rel="noopener">List my shop</a>
        <a class="btn" style="background:transparent;border:1px solid rgba(255,255,255,.65);" href="tel:0536340578">Call 053 634 0578</a></div></div>

    <h2 class="sec">How it works</h2>
    <ol class="join-steps">
      <li><b>Get listed</b>Call or WhatsApp us. Listing is free, and shops on NYANSATEK POS already have their online shop switched on.</li>
      <li><b>Your products go up</b>With your prices and photos. On NYANSATEK POS you add them yourself at nyansatek.shop.</li>
      <li><b>Customers order and pay us</b>By MoMo, before anything happens. No unpaid or prank orders reach you.</li>
      <li><b>We call you, then a rider</b>We place the order with you by phone and send a rider to collect it.</li>
    </ol>

    <h2 class="sec">What you get</h2>
    <div class="join-gets">
      <div><b>Listed on nyansatek.store</b>Your products in front of customers shopping across every category.</div>
      <div><b>Your full price, every day</b>You receive exactly your prices by MoMo by close of business.</div>
      <div><b>Paid before it reaches you</b>Every order is paid by MoMo first. No pay on delivery, no prank orders.</div>
      <div><b>Delivery arranged for you</b>We call a rider to collect and deliver. The customer pays the rider's fee.</div>
      <div><b>Your own online shop page</b>Free with NYANSATEK POS: a link you can share on WhatsApp and social media.</div>
      <div><b>NYANSATEK POS, if you want it</b>Sell in the shop and online from the same stock, with sales and profit reports.</div>
    </div>

    <h2 class="sec">What it costs</h2>
    <p style="margin:6px 0 10px;line-height:1.5;"><b>Listing on nyansatek.store is free.</b></p>
    <div class="join-price">

// ---------- order tracking ----------
const STEPS_DELIVERY = [['placed', 'Order placed'], ['accepted', 'Shop confirmed'], ['ready', 'Packed and ready'], ['in_transit', 'On the way'], ['delivered', 'Delivered']];
const STEPS_PICKUP = [['placed', 'Order placed'], ['accepted', 'Shop confirmed'], ['ready', 'Packed and ready'], ['in_transit', 'On the way to the pickup point'], ['at_pickup_point', 'Ready to collect'], ['collected', 'Collected']];
const ORDER_OF = s => ({ placed: 0, accepted: 1, ready: 2, in_transit: 3, at_pickup_point: 4, delivered: 5, collected: 5, completed: 6 })[s] ?? -1;
let trackTimer = null;
async function tracking(token) {
  const { data: o, error } = await sb.rpc('get_online_order', { p_token: token });
  if (error || !o) { app.innerHTML = '<div class="empty">Order not found. Check the link in your SMS.</div>'; return; }
  document.title = 'Order ' + o.code + ' · nyansatek.store';
  const steps = o.fulfilment === 'pickup' ? STEPS_PICKUP : STEPS_DELIVERY;
  const done = o.status === 'completed' ? 99 : ORDER_OF(o.status);
  const ended = ['cancelled', 'returning', 'returned'].includes(o.status);
  const finished = ['delivered', 'collected', 'completed'].includes(o.status);
  const label = { placed: o.payment_confirmed ? 'Payment received' : 'Waiting for your payment', accepted: 'Confirmed', ready: 'Ready', in_transit: 'On the way', at_pickup_point: 'Ready to collect',
    delivered: 'Delivered', collected: 'Collected', completed: 'Completed', cancelled: 'Cancelled', returning: 'Not collected', returned: 'Returned to shop' }[o.status] || o.status;
  const minsLeft = Math.max(0, Math.ceil((new Date(o.accept_deadline) - Date.now()) / 60000));
  app.innerHTML = `<h1>Order ${E(o.code)}</h1><p class="note">${E(o.shop.name)}</p><div style="max-width:640px;">
    <div class="box"><span class="status ${ended ? 'bad' : finished ? 'good' : ''}">${E(label)}</span>
      ${o.status === 'placed' ? `<p class="note" style="margin-top:8px;">${o.payment_confirmed ? 'Payment received. Your order is being prepared.'
        : `Pay within ${minsLeft} minute${minsLeft === 1 ? '' : 's'}, or the order is cancelled automatically.`}</p>` : ''}
      ${ended && o.cancel_reason ? `<p class="note" style="margin-top:8px;">${E(o.cancel_reason)}</p>` : ''}
      ${!ended ? `<ul class="steps">${steps.map(([k, t], i) => `<li class="${ORDER_OF(k) < done || (i === steps.length - 1 && done >= ORDER_OF(k)) ? 'done' : ORDER_OF(k) === done ? 'now' : ''}"><span class="dot"></span>${E(t)}</li>`).join('')}</ul>` : ''}</div>
    ${o.payment_method === 'momo' && !o.payment_confirmed && !ended ? `<div class="box"><b>Pay by MoMo</b>
      ${payTo(o.pay_to, o.total)}
      <p class="note" style="margin-top:6px;">Use your order number <b>${E(o.code)}</b> as the reference, then enter the transaction ID below.</p>
      ${o.status === 'placed' ? `<div class="fg"><label>MoMo transaction ID</label><input id="t-ref" value="${E(o.momo_txn_id || '')}"></div>
      <button class="btn" id="t-send">Send transaction ID</button><div class="err" id="t-err"></div>` : ''}</div>` : ''}
    ${!ended && !finished && o.fulfilment === 'pickup' ? `<div class="box"><b>Your collection code</b><div class="big" style="margin:6px 0;">${E(o.delivery_code)}</div>
      <p class="note">Give this code to the pickup point staff only when you receive your order.</p></div>` : ''}
    ${o.courier && !ended && !finished ? `<div class="box"><b>Your rider</b><p style="margin-top:6px;">${E(o.courier.name)} · <a href="tel:0${E(String(o.courier.phone).slice(3))}">0${E(String(o.courier.phone).slice(3))}</a></p>
      <p class="note">Pay the rider's delivery fee when your order arrives.</p></div>` : ''}
    ${o.fulfilment === 'pickup' && o.pickup_point ? `<div class="box"><b>Pickup point</b><p style="margin-top:6px;">${E(o.pickup_point.name)}<br><span class="note">${E(o.pickup_point.address)}${o.pickup_point.landmark ? ' · ' + E(o.pickup_point.landmark) : ''}${o.pickup_point.hours ? '<br>Open: ' + E(o.pickup_point.hours) : ''}</span></p>
      ${o.pickup_deadline ? `<p class="note" style="margin-top:6px;">Collect by ${new Date(o.pickup_deadline).toLocaleString()}.</p>` : ''}</div>` : ''}
    ${o.fulfilment === 'delivery' ? `<div class="box"><b>Delivery to</b><p class="note" style="margin-top:6px;">${E([o.zone, o.address, o.landmark].filter(Boolean).join(' · '))}</p></div>` : ''}
    <div class="box"><b>Items</b>${o.items.map(i => `<div class="sum" style="background:none;border:0;padding:4px 0;margin:0;"><div><span>${i.qty} × ${E(i.name)}</span><span>${GH(i.line_total)}</span></div></div>`).join('')}
      <div class="sum"><div><span>Items</span><span>${GH(o.goods_total)}</span></div>${o.fulfilment === 'delivery' ? `<div><span>Delivery</span><span>${Number(o.delivery_fee) ? GH(o.delivery_fee) : 'Paid to the rider on arrival'}</span></div>` : ''}<div class="tot"><span>Total paid by MoMo</span><span>${GH(o.total)}</span></div></div></div>
    <p class="note" style="text-align:center;margin:10px 0 20px;">Keep this page: it's your order tracking link. Questions? Call or WhatsApp us on <a href="tel:0536340578">${NYANSATEK_PHONE}</a>.</p></div>`;
  const send = document.getElementById('t-send');
  if (send) send.onclick = async () => {
    const { error } = await sb.rpc('add_order_momo_ref', { p_token: token, p_txn: document.getElementById('t-ref').value.trim() });
    if (error) { document.getElementById('t-err').textContent = errMsg(error); return; }
    tracking(token);
  };
  if (!['completed', 'cancelled', 'returned'].includes(o.status)) trackTimer = setTimeout(() => {
    if (curPath() === '/t/' + token && document.activeElement?.id !== 't-ref') tracking(token);
  }, 20000);
}

// How to pay: MoMoPay to the NYANSATEK VENTURES merchant ID (or the number, if no merchant ID is set).
function payTo(t, amount) {
  if (t.merchant_id) return `<p class="note" style="margin:6px 0;">Pay <b>${GH(amount)}</b> with MoMoPay to merchant ID:</p>
      <div class="big">${E(t.merchant_id)}</div>${t.momo_name ? `<div class="note">${E(t.momo_name)}</div>` : ''}
      <p class="note" style="margin-top:6px;">On MTN MoMo: dial *170#, choose MoMoPay, then enter the merchant ID.</p>`;
  return `<p class="note" style="margin:6px 0;">Send <b>${GH(amount)}</b> by MoMo to:</p>
      <div class="big">${E('0' + String(t.momo_number || '').slice(3))}</div>${t.momo_name ? `<div class="note">${E(t.momo_name)}</div>` : ''}`;
}

// ---------- checkout tracking: one payment, one page, each shop's part shown separately ----------
async function checkoutTracking(token) {
  const { data: k, error } = await sb.rpc('get_checkout', { p_token: token });
  if (error || !k) { app.innerHTML = '<div class="empty">Order not found. Check the link in your SMS.</div>'; return; }
  document.title = 'Order ' + k.code + ' · nyansatek.store';
  const orders = k.orders || [], live = orders.filter(o => o.status !== 'cancelled');
  const allCancelled = !live.length, done = live.length && live.every(o => ['delivered', 'collected', 'completed'].includes(o.status));
  const unpaid = !allCancelled && !k.payment_confirmed;
  const minsLeft = Math.max(0, Math.ceil((new Date(k.accept_deadline) - Date.now()) / 60000));
  const total = live.reduce((a, o) => a + Number(o.total), 0);
  const label = o => ({ placed: o.payment_confirmed ? 'Payment received' : 'Waiting for payment', accepted: 'Confirmed', ready: 'Ready', in_transit: 'On the way',
    at_pickup_point: 'Ready to collect', delivered: 'Delivered', collected: 'Collected', completed: 'Completed', cancelled: 'Cancelled', returning: 'Not collected', returned: 'Returned' })[o.status] || o.status;
  const first = orders[0] || {};
  app.innerHTML = `<h1>Order ${E(k.code)}</h1><div style="max-width:640px;">
    <div class="box"><span class="status ${allCancelled ? 'bad' : done ? 'good' : ''}">${allCancelled ? 'Cancelled' : done ? 'Delivered' : unpaid ? 'Waiting for your payment' : 'Payment received'}</span>
      ${unpaid ? `<p class="note" style="margin-top:8px;">Pay within ${minsLeft} minute${minsLeft === 1 ? '' : 's'}, or the order is cancelled automatically.</p>`
        : !allCancelled && !done ? '<p class="note" style="margin-top:8px;">Your order is being prepared. We will text you when it is on the way.</p>' : ''}
      ${allCancelled && first.cancel_reason ? `<p class="note" style="margin-top:8px;">${E(first.cancel_reason)}</p>` : ''}</div>
    ${unpaid ? `<div class="box"><b>Pay by MoMo</b>
      ${payTo(k.pay_to, total)}
      <p class="note" style="margin-top:6px;">Use your order number <b>${E(k.code)}</b> as the reference, then enter the transaction ID below.</p>
      <div class="fg"><label>MoMo transaction ID</label><input id="t-ref" value="${E(k.momo_txn_id || '')}"></div>
      <button class="btn" id="t-send">Send transaction ID</button><div class="err" id="t-err"></div></div>` : ''}
    ${first.fulfilment === 'delivery' ? `<div class="box"><b>Delivery to</b><p class="note" style="margin-top:6px;">${E([first.zone, first.address, first.landmark].filter(Boolean).join(' · '))}</p>
      <p class="note" style="margin-top:4px;">The rider will call you when they are close. Pay the rider's delivery fee when your order arrives.</p></div>` : ''}
    ${orders.map(o => `<div class="box"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;"><b>${E(o.shop.name)}</b>
        <span class="status ${o.status === 'cancelled' ? 'bad' : ['delivered', 'collected', 'completed'].includes(o.status) ? 'good' : ''}">${E(label(o))}</span></div>
      ${o.items.map(i => `<div class="sum" style="background:none;border:0;padding:4px 0;margin:0;"><div><span>${i.qty} × ${E(i.name)}</span><span>${GH(i.line_total)}</span></div></div>`).join('')}
      ${o.courier && !['delivered', 'collected', 'completed', 'cancelled'].includes(o.status) ? `<p class="note" style="margin-top:6px;">Rider: ${E(o.courier.name)} · <a href="tel:0${E(String(o.courier.phone).slice(3))}">0${E(String(o.courier.phone).slice(3))}</a></p>` : ''}
      ${o.fulfilment === 'pickup' && !['collected', 'completed', 'cancelled'].includes(o.status) ? `<p class="note" style="margin-top:6px;">Collection code <b>${E(o.delivery_code)}</b>${o.pickup_point ? ' · ' + E(o.pickup_point.name) : ''}</p>` : ''}
      ${o.status === 'cancelled' && o.cancel_reason && !allCancelled ? `<p class="note" style="margin-top:6px;">${E(o.cancel_reason)}</p>` : ''}</div>`).join('')}
    <div class="box"><div class="sum" style="margin:0;"><div><span>Items</span><span>${GH(total)}</span></div>${first.fulfilment === 'delivery' ? '<div><span>Delivery</span><span>Paid to the rider on arrival</span></div>' : ''}<div class="tot"><span>Total by MoMo</span><span>${GH(total)}</span></div></div></div>
    <p class="note" style="text-align:center;margin:10px 0 20px;">Keep this page: it's your order tracking link. Questions? Call or WhatsApp us on <a href="tel:0536340578">${NYANSATEK_PHONE}</a>.</p></div>`;
  const send = document.getElementById('t-send');
  if (send) send.onclick = async () => {
    const { error } = await sb.rpc('add_checkout_momo_ref', { p_token: token, p_txn: document.getElementById('t-ref').value.trim() });
    if (error) { document.getElementById('t-err').textContent = errMsg(error); return; }
    checkoutTracking(token);
  };
  if (!allCancelled && !done) trackTimer = setTimeout(() => {
    if (curPath() === '/k/' + token && document.activeElement?.id !== 't-ref') checkoutTracking(token);
  }, 20000);
}

updateCartBtn(); route();

// Lets the marketplace be installed as an app and open when the connection is poor.
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

</script>
<script>
// ── ORDER BY PHONE: call to order, voice note, call me back ──────────────
// Calls and voice notes go to NYANSATEK's own numbers (set in /ops Settings), never to the business.
(function () {

  const esc = s => s == null ? '' : String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const css = document.createElement('style');
  css.textContent = `

  .obp .x{float:right;border:0;background:none;font-size:1.6rem;line-height:1;cursor:pointer;color:var(--g);}

  .obp .opt h3{margin:0 0 4px;font-size:.98rem;}
  .obp .call{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:8px;text-decoration:none;}
  .obp .call svg{width:18px;height:18px;flex:none;}
  .obp .rec{display:flex;align-items:center;gap:10px;margin-top:8px;}
  .obp .recbtn{width:56px;height:56px;border-radius:50%;border:0;background:#d92d20;color:#fff;font-weight:800;cursor:pointer;flex:none;}
  .obp .recbtn.on{animation:obpPulse 1s infinite;}
  @keyframes obpPulse{0%{box-shadow:0 0 0 0 rgba(217,45,32,.5)}100%{box-shadow:0 0 0 14px rgba(217,45,32,0)}}
  .obp audio{width:100%;margin-top:8px;}
  .obp .ok{background:#ecfdf3;border:1px solid #abefc6;color:#05603a;border-radius:12px;padding:12px;margin-top:10px;}
  .obp .tabs{display:flex;gap:6px;margin:12px 0 0;}
  .obp .tabs button{flex:1;border:1px solid var(--b);background:#fff;border-radius:10px;padding:8px 4px;font-weight:700;font-size:.8rem;cursor:pointer;color:var(--p);}
  .obp .tabs button.on{background:var(--p);color:#fff;border-color:var(--p);}`;
  document.head.appendChild(css);

  const PHONE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2z"/></svg>';
  const fab = document.createElement('button');
  fab.className = 'obp-fab'; fab.type = 'button'; fab.innerHTML = PHONE_SVG + '<span>Order by phone</span>';
  fab.onclick = () => window.openOrderByPhone();
  document.body.appendChild(fab);

  let INFO = null;
  async function info() {
    try { const { data } = await sb.rpc('phone_ordering'); if (data) INFO = data; } catch (e) {}
    return INFO || { phones: ['0536340578'], opens_at: '09:00', closes_at: '21:00', open_now: true };
  }
  const t12 = hm => { const [h, m] = String(hm).split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; const h12 = h % 12 || 12; return h12 + (m ? ':' + String(m).padStart(2, '0') : '') + ap; };
  const pretty = n => String(n).replace(/^(\d{3})(\d{3})(\d{4})$/, '$1 $2 $3');
  const cartSummary = () => {
    try {
      return Object.entries(CART || {}).flatMap(([org, c]) => Object.values(c.items).map(i => ({ org_id: org, product_id: i.p.id, shop: c.shop.name, name: i.p.name, qty: i.qty, price: i.p.price })));
    } catch (e) { return []; }
  };
  const buyer = () => { try { return JSON.parse(localStorage.getItem('buyer')) || {}; } catch (e) { return {}; } };

  let rec = null, chunks = [], blob = null, ext = 'webm', mime = 'audio/webm', secs = 0, tick = null;
  function stopTracks() { try { rec && rec.stream.getTracks().forEach(t => t.stop()); } catch (e) {} }
  function close() { stopTracks(); clearInterval(tick); rec = null; const b = document.getElementById('obp-bg'); if (b) b.remove(); }

  window.openOrderByPhone = async function (tab) {
    close();
    const I = await info(); const hours = `${t12(I.opens_at)} to ${t12(I.closes_at)}`;
    const cart = cartSummary(), b = buyer();
    const cartNote = cart.length ? `<p class="note" style="margin-top:6px;">Your cart (${cart.reduce((a, i) => a + i.qty, 0)} item${cart.length > 1 || cart[0].qty > 1 ? 's' : ''}) is sent along with it.</p>` : '';
    const bg = document.createElement('div'); bg.className = 'obp-bg'; bg.id = 'obp-bg';
    bg.onclick = e => { if (e.target === bg) close(); };
    bg.innerHTML = `<div class="obp" role="dialog" aria-modal="true" aria-label="Order by phone">
      <button class="x" type="button" aria-label="Close">×</button>
      <h2>Order by phone</h2>
      <p class="note">${I.open_now ? `We're answering now, ${hours} every day.` : `Our lines are closed now. We answer ${hours}. Send a voice note or ask us to call you, and we'll get back to you when we open.`}</p>
      ${I.open_now ? `<div class="opt"><h3>Call to order</h3><p class="note">Tell us what you want and where you are. We'll text you how to pay.</p>
        ${I.phones.map(n => `<a class="btn gold call" href="tel:${esc(n)}">${PHONE_SVG}<span>Call ${esc(pretty(n))}</span></a>`).join('')}</div>` : ''}
      <div class="tabs"><button type="button" data-t="voice" class="on">Send a voice note</button><button type="button" data-t="callback">Call me back</button></div>
      <div class="opt" id="obp-body"></div>
    </div>`;
    document.body.appendChild(bg);
    bg.querySelector('.x').onclick = close;
    const body = bg.querySelector('#obp-body');
    const fields = `<div class="fg"><label>Your name</label><input id="obp-name" autocomplete="name" value="${esc(b.name || '')}"></div>
      <div class="fg"><label>Phone number we should call</label><input id="obp-phone" type="tel" autocomplete="tel" placeholder="024XXXXXXX" value="${esc(b.phone || '')}"></div>`;
    const show = t => {
      bg.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x.dataset.t === t));
      stopTracks(); clearInterval(tick); rec = null; blob = null; secs = 0;
      if (t === 'voice') {
        body.innerHTML = `<h3>Send your order as a voice note</h3>
          <p class="note">Say what you want, how many, and where you are. Up to 2 minutes.</p>
          <div class="rec"><button class="recbtn" id="obp-rec" type="button" aria-label="Record">REC</button>
            <div><b id="obp-time">0:00</b><div class="note" id="obp-hint">Tap to start recording</div></div></div>
          <audio id="obp-play" controls style="display:none"></audio>
          ${fields}
          <div class="fg"><label>Your location (optional)</label><input id="obp-loc" placeholder="Area or town" value="${esc(b.loc || '')}"></div>
          ${cartNote}<div class="err" id="obp-err"></div>
          <button class="btn gold" style="width:100%;margin-top:6px;" id="obp-send" type="button" disabled>Send voice note</button>`;
        body.querySelector('#obp-rec').onclick = toggleRec;
      } else {
        body.innerHTML = `<h3>Call me back</h3><p class="note">Leave your number and the team will call you${I.open_now ? ' shortly' : ` from ${t12(I.opens_at)}`}. It doesn't cost you airtime.</p>
          ${fields}${cartNote}<div class="err" id="obp-err"></div>
          <button class="btn gold" style="width:100%;margin-top:6px;" id="obp-send" type="button">Call me back</button>`;
      }
      body.querySelector('#obp-send').onclick = () => send(t, I);
    };
    bg.querySelectorAll('.tabs button').forEach(x => x.onclick = () => show(x.dataset.t));
    show(tab === 'callback' ? 'callback' : 'voice');
  };

  async function toggleRec() {
    const btn = document.getElementById('obp-rec'), hint = document.getElementById('obp-hint'), err = document.getElementById('obp-err');
    err.textContent = '';
    if (rec && rec.state === 'recording') { rec.stop(); return; }
    if (!navigator.mediaDevices || !window.MediaRecorder) { err.textContent = "This browser can't record. Use Call me back instead, or open the page in Chrome."; return; }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { err.textContent = 'Allow the microphone to record a voice note, or use Call me back.'; return; }
    const pick = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus', 'audio/aac'].find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m));
    rec = pick ? new MediaRecorder(stream, { mimeType: pick }) : new MediaRecorder(stream);
    mime = (rec.mimeType || pick || 'audio/webm').split(';')[0];
    ext = { 'audio/webm': 'webm', 'audio/mp4': 'm4a', 'audio/ogg': 'ogg', 'audio/aac': 'aac', 'audio/mpeg': 'mp3', 'audio/x-m4a': 'm4a' }[mime] || 'webm';
    chunks = []; blob = null; secs = 0;
    rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      clearInterval(tick); stopTracks(); btn.classList.remove('on'); btn.textContent = 'REC';
      blob = new Blob(chunks, { type: mime });
      const a = document.getElementById('obp-play'); if (a) { a.src = URL.createObjectURL(blob); a.style.display = ''; }
      hint.textContent = 'Listen back, or tap REC to record again';
      document.getElementById('obp-send').disabled = !blob.size;
    };
    rec.start(); btn.classList.add('on'); btn.textContent = 'STOP'; hint.textContent = 'Recording… tap STOP when you finish';
    document.getElementById('obp-send').disabled = true; document.getElementById('obp-play').style.display = 'none';
    tick = setInterval(() => {
      secs++; document.getElementById('obp-time').textContent = Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
      if (secs >= 120 && rec && rec.state === 'recording') rec.stop();
    }, 1000);
  }

  async function send(kind, I) {
    const err = document.getElementById('obp-err'), btn = document.getElementById('obp-send');
    const v = id => (document.getElementById(id)?.value || '').trim();
    err.textContent = '';
    if (!/^(\+?233|0)?\d{9}$/.test(v('obp-phone').replace(/\s/g, ''))) { err.textContent = 'Enter the phone number we should call.'; return; }
    if (kind === 'voice' && !(blob && blob.size)) { err.textContent = 'Record your voice note first.'; return; }
    btn.disabled = true; btn.textContent = 'Sending…';
    try {
      const p = { kind, site: SITE, name: v('obp-name'), phone: v('obp-phone'), location: v('obp-loc'), cart: cartSummary() };
      if (kind === 'voice') {
        const id = (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
        const path = `new/${id}.${ext}`;
        const up = await sb.storage.from('voice-orders').upload(path, blob, { contentType: mime, upsert: false });
        if (up.error) throw up.error;
        Object.assign(p, { audio_path: path, seconds: secs });
      }
      const { data, error } = await sb.rpc('submit_order_request', { p });
      if (error) throw error;
      try { const b = buyer(); localStorage.setItem('buyer', JSON.stringify(Object.assign(b, { name: p.name || b.name, phone: p.phone, loc: p.location || b.loc }))); } catch (e) {}
      const when = data && data.open_now ? 'shortly' : `when we open at ${t12((data && data.opens_at) || I.opens_at)}`;
      document.getElementById('obp-body').innerHTML = `<div class="ok"><b>${kind === 'voice' ? 'Voice note sent.' : 'Got it.'}</b><br>The team will call you on ${esc(v('obp-phone') || p.phone)} ${when} to confirm your order. We'll text you how to pay.</div>`;
    } catch (e) {
      btn.disabled = false; btn.textContent = kind === 'voice' ? 'Send voice note' : 'Call me back';
      err.textContent = (e && e.message) || 'Something went wrong. Please try again.';
    }
  }
})();
</script>
<script>
// ---------- "Get the app" wall for visitors who scan the printed QR code ----------
// Arriving with ?src=qr marks this phone. From then on, every visit in the browser shows a full-screen screen with
// no close button until the app is installed: Android/Chrome installs with one tap; on iPhone it shows
// Share > Add to Home Screen; inside a QR-scanner or social-app browser (where installing is impossible) it asks to
// open the page in Chrome or Safari. Opening the installed app (standalone) never shows it.
(() => {
  const E = s => s == null ? '' : String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const fromQr = new URLSearchParams(location.search).get('src') === 'qr';
  const get = () => { try { return localStorage.getItem('nt-install'); } catch (e) { return null; } };
  const set = v => { try { localStorage.setItem('nt-install', v); } catch (e) {} };
  if (standalone) { set('done'); return; }
  if (fromQr && get() !== 'done') set('due');
  if (get() !== 'due' && !fromQr) return;
  if (get() === 'done') return;

  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const android = /Android/i.test(ua);
  const inApp = /FBAN|FBAV|FB_IAB|Instagram|Line\/|MicroMessenger|Snapchat|TikTok|Twitter|; wv\)|GSA\//i.test(ua) || (ios && !/Safari\//i.test(ua));
  // On Android only Chrome installs safely: Samsung Internet and other browsers build their own app package, which
  // Google Play Protect blocks as "Unsafe app" ("built for an older version of Android"). Send those to Chrome.
  const noChrome = new URLSearchParams(location.search).get('nochrome') === '1';
  const chrome = /Chrome\/\d/.test(ua) && !/SamsungBrowser|OPR\/|OPX|EdgA|YaBrowser|UCBrowser|MiuiBrowser|HuaweiBrowser|HeyTapBrowser|VivoBrowser|Firefox|DuckDuckGo|PHX\//i.test(ua);
  const otherBrowser = android && !inApp && !chrome;
  const name = document.querySelector('meta[name=apple-mobile-web-app-title]')?.content || document.title;
  const link = location.origin + location.pathname + '?src=qr';
  const toChrome = `intent://${location.host}${location.pathname}?src=qr#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(link + '&nochrome=1')};end`;
  let deferred = null;

  const css = document.createElement('style');
  css.textContent = `#nt-wall{position:fixed;inset:0;z-index:2147483647;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto;}
    #nt-wall .in{max-width:420px;width:100%;text-align:center;}
    #nt-wall img{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 30px rgba(0,0,0,.3);}
    #nt-wall h2{font-size:1.6rem;margin:18px 0 8px;line-height:1.2;}
    #nt-wall p{opacity:.92;line-height:1.5;margin:8px 0;}
    #nt-wall ul{text-align:left;margin:16px auto;max-width:320px;line-height:1.7;padding-left:20px;}
    #nt-wall .go{display:block;width:100%;margin-top:18px;padding:16px;border:0;border-radius:14px;background:#fff;color:var(--p);font-weight:800;font-size:1.1rem;cursor:pointer;}
    #nt-wall .sm{display:inline-block;margin-top:14px;padding:10px 14px;border:1px solid rgba(255,255,255,.6);border-radius:10px;background:transparent;color:#fff;font-weight:600;cursor:pointer;}
    #nt-wall ol{text-align:left;margin:16px auto;max-width:330px;line-height:1.8;padding-left:22px;background:rgba(255,255,255,.12);border-radius:14px;padding:14px 14px 14px 36px;}
    #nt-wall b.k{background:#fff;color:var(--p);border-radius:6px;padding:1px 7px;white-space:nowrap;}
    #nt-wall a.go{text-decoration:none;}`;
  document.head.appendChild(css);
  const wall = document.createElement('div');
  wall.id = 'nt-wall'; wall.setAttribute('role', 'dialog'); wall.setAttribute('aria-modal', 'true'); wall.setAttribute('aria-label', 'Get the ' + name + ' app');
  document.body.appendChild(wall);
  document.documentElement.style.overflow = 'hidden'; document.body.style.overflow = 'hidden';
  // Put the wall back if anything removes it.
  new MutationObserver(() => { if (!document.getElementById('nt-wall') && get() === 'due') document.body.appendChild(wall); }).observe(document.body, { childList: true });

  const head = `<img src="icon-192.png" alt=""><h2>Get the ${E(name)} app</h2>`;
  const perks = `<ul><li>Order in a few taps, straight from your home screen</li><li>Track every order live</li><li>Hear first about new ${/food/i.test(name) ? 'restaurants and dishes' : 'shops and deals'}</li></ul>`;
  const done = () => { set('done'); document.documentElement.style.overflow = ''; document.body.style.overflow = ''; wall.remove(); };
  function render() {
    if (inApp) {
      wall.innerHTML = `<div class="in">${head}<p>This page is open inside another app, which can't install ${E(name)}.</p>
        <ol><li>${android ? 'Tap <b class="k">Open in Chrome</b> below' : 'Tap the <b class="k">⋯</b> menu at the top or bottom'}</li><li>${android ? 'Then tap <b class="k">Install</b>' : 'Choose <b class="k">Open in Safari</b>, then follow the steps there'}</li></ol>
        ${android ? `<a class="go" href="${toChrome}">Open in Chrome</a>` : ''}
        <button class="sm" id="nt-copy">Copy the link</button></div>`;
      document.getElementById('nt-copy').onclick = e => { navigator.clipboard?.writeText(link).then(() => e.target.textContent = 'Link copied. Paste it in ' + (android ? 'Chrome' : 'Safari')); };
    } else if (otherBrowser && noChrome) {
      // Chrome is not on this phone: don't offer this browser's install (it is the one Play Protect blocks).
      wall.innerHTML = `<div class="in">${head}<p>To install ${E(name)}, you need the Chrome browser. Get Chrome from the Play Store, then scan the QR code again.</p>
        <a class="go" href="https://play.google.com/store/apps/details?id=com.android.chrome">Get Chrome</a>
        <button class="sm" id="nt-skip">Continue in this browser</button></div>`;
      document.getElementById('nt-skip').onclick = done;
    } else if (otherBrowser) {
      wall.innerHTML = `<div class="in">${head}${perks}<p>${E(name)} installs from Chrome.</p>
        <a class="go" href="${toChrome}">Open in Chrome</a>
        <ol><li>Tap <b class="k">Open in Chrome</b></li><li>Then tap <b class="k">Install the app</b></li></ol></div>`;
    } else if (ios) {
      wall.innerHTML = `<div class="in">${head}${perks}
        <ol><li>Tap the <b class="k">Share</b> button <span aria-hidden="true">(the square with an arrow)</span></li><li>Scroll and tap <b class="k">Add to Home Screen</b></li><li>Tap <b class="k">Add</b>, then open ${E(name)} from your home screen</li></ol>
        <button class="sm" id="nt-ios">I've added it</button></div>`;
      document.getElementById('nt-ios').onclick = done;
    } else if (deferred) {
      wall.innerHTML = `<div class="in">${head}${perks}<button class="go" id="nt-install">Install the app</button><p style="font-size:.85rem;">Free. Takes a few seconds and uses almost no space.</p></div>`;
      document.getElementById('nt-install').onclick = async () => { deferred.prompt(); const c = await deferred.userChoice.catch(() => null); deferred = null; if (!c || c.outcome !== 'accepted') render(); };
    } else {
      wall.innerHTML = `<div class="in">${head}${perks}
        <ol><li>Tap the browser menu <b class="k">⋮</b></li><li>Tap <b class="k">Install app</b> or <b class="k">Add to Home screen</b></li><li>Open ${E(name)} from your home screen</li></ol>
</div>`;
    }
  }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); if (otherBrowser) return; deferred = e; render(); });
  window.addEventListener('appinstalled', () => {
    set('done');
    wall.innerHTML = `<div class="in">${head}<p>Installed. Open <b>${E(name)}</b> from your home screen to order.</p></div>`;
  });
  render();
})();
</script>
</body>
</html>
